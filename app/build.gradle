plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usama.dailytracker'
    compileSdk 34

    defaultConfig {
        // This ID never changes, so the app's name can change later without losing data.
        applicationId "com.usama.dailytracker"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            // One fixed key so every new version installs over the old one and keeps your data.
            storeFile file("release.keystore")
            storePassword "pursepulse"
            keyAlias "pursepulse"
            keyPassword "pursepulse"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
