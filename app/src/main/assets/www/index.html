/* ---------- CSV export and My Money import ---------- */
function csvCell(v){v=String(v??'');return '"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){const rows=[['TIME','TYPE','AMOUNT','CATEGORY','ACCOUNT','NOTES']];
  allTx().slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0)).forEach(t=>{const d=pkey(t.date);const tm=t.t?new Date(t.t):d;let h=tm.getHours(),mi=tm.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;
    const time=`${MON[d.getMonth()]} ${pad(d.getDate())}, ${d.getFullYear()} ${h}:${pad(mi)} ${ap}`;
    let type,catn='',accn=acc(t.acc).name;
    if(t.type==='inc'){type='(+) Income';catn=cat(t.cat).name}else if(t.type==='exp'){type='(-) Expense';catn=cat(t.cat).name}
    else if(t.type==='ln'){type=t.mv==='in'?'(+) Income':'(-) Expense';catn=txName(t)}else{type='(*) Transfer';catn='  -  ';accn=acc(t.acc).name+'->'+acc(t.to).name}
    rows.push([time,type,t.amt.toFixed(2),catn,accn,t.note||''])});
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  if(window.Android&&Android.shareFile)Android.shareFile('purse-and-pulse-records-'+dkey(today())+'.csv',csv);else toast('Export works in the phone app')}
function parseCsv(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importMyMoney(text){const rows=parseCsv(text);if(!rows.length)throw new Error('empty');const H=rows[0].map(h=>h.trim().toUpperCase());
  const ix=n=>H.indexOf(n);const iT=ix('TIME'),iY=ix('TYPE'),iA=ix('AMOUNT'),iC=ix('CATEGORY'),iAc=ix('ACCOUNT'),iN=ix('NOTES');if(iT<0||iY<0||iA<0)throw new Error('format');
  const findAcc=n=>{n=n.trim();let a=S.money.accounts.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!a){a={id:uid(),name:n,start:0};S.money.accounts.push(a)}return a.id};
  const ALIAS={transportation:'transport',bills:'bills & utilities',donation:'charity & sadqa',donations:'charity & sadqa',others:'other',groceries:'groceries'};
  const findCat=(n,type)=>{n=n.trim();const lo=n.toLowerCase();let c=S.money.cats.find(x=>x.type===type&&x.name.toLowerCase()===lo)||S.money.cats.find(x=>x.type===type&&x.name.toLowerCase()===ALIAS[lo]);if(!c){c={id:uid(),name:n,type,color:COLORS[S.money.cats.length%COLORS.length]};S.money.cats.push(c)}return c.id};
  const have={};allTx().forEach(t=>{const k=[t.date,t.type,Math.round(t.amt*100),t.acc,t.to||''].join('|');have[k]=(have[k]||0)+1});
  let added=0,skipped=0;const ch=new Set(['money']);
  rows.slice(1).forEach(r=>{const tm=(r[iT]||'').trim();const m=tm.match(/^([A-Za-z]{3}) (\d{1,2}), (\d{4})(?: (\d{1,2}):(\d{2}) ?([AP]M))?/);if(!m)return;
    const mo=MON.indexOf(m[1]);if(mo<0)return;let hh=+(m[4]||12)%12;if(m[6]==='PM')hh+=12;const dt=new Date(+m[3],mo,+m[2],hh,+(m[5]||0));const date=dkey(dt);
    const ty=(r[iY]||'');const amt=Math.round(parseFloat(String(r[iA]).replace(/,/g,''))*100)/100;if(!(amt>0))return;
    const ac=(r[iAc]||'Cash');const note=iN>=0?(r[iN]||'').trim():'';let o;
    if(/transfer/i.test(ty)){const [a1,a2]=ac.split('->');if(!a2)return;o={type:'tr',acc:findAcc(a1),to:findAcc(a2)}}
    else if(/income|\+/.test(ty))o={type:'inc',acc:findAcc(ac),cat:findCat(r[iC]||'Other income','inc')};
    else o={type:'exp',acc:findAcc(ac),cat:findCat(r[iC]||'Other','exp')};
    const k=[date,o.type,Math.round(amt*100),o.acc,o.to||''].join('|');if(have[k]>0){have[k]--;skipped++;return}
    const t={id:uid(),date,t:+dt,amt,note,...o};(S.tx[ymOf(date)]=S.tx[ymOf(date)]||[]).push(t);ch.add('tx-'+ymOf(date));added++});
  save(...ch);return{added,skipped}}

/* ---------- PIN lock ---------- */
async function pinHash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pp:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'pp:'+p)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
function pinSet(){try{return localStorage.getItem('pp-pin')}catch(e){return null}}
function showLock(){if(!pinSet()||$('#lock'))return;const d=document.createElement('div');d.id='lock';let v='';
  d.innerHTML=`<div class="lockin"><div class="lbl">Purse &amp; Pulse</div><h3 style="font-family:var(--f-display);margin:6px 0 4px">Enter your PIN</h3><div id="lk-dots" class="lkdots"></div><p class="small exp" id="lk-err" style="min-height:18px;margin:6px 0"></p><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}">${k}</button>`).join('')}</div></div>`;
  document.body.appendChild(d);const dots=()=>{d.querySelector('#lk-dots').innerHTML=[...Array(Math.max(4,v.length))].map((_,i)=>`<i class="${i<v.length?'on':''}"></i>`).join('')};dots();
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<8)v+=k;dots();d.querySelector('#lk-err').textContent='';
    if(v.length>=4&&await pinHash(v)===pinSet()){d.remove();UI.lockedAt=0}else if(v.length>=8){v='';dots();d.querySelector('#lk-err').textContent='Wrong PIN. Try again.'}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)UI.hiddenAt=Date.now();else if(pinSet()&&UI.hiddenAt&&Date.now()-UI.hiddenAt>60000)showLock()});
function pinSheet(){const has=!!pinSet();
  openSheet(`<h3>App lock</h3><form class="form" id="pf2"><div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">${has?'Change PIN':'Turn on lock'}</button></div>
   <p class="small muted" style="margin:0">The app asks for this PIN when you open it, and after it has been in the background for a minute. If you forget the PIN, there is no way to reset it, so keep a backup.</p>
   ${has?'<label class="field"><span>Current PIN</span><input class="inp num" id="p-old" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"></label>':''}
   <label class="field"><span>New PIN (4 to 8 digits)</span><input class="inp num" id="p-1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"></label>
   <label class="field"><span>Type it again</span><input class="inp num" id="p-2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"></label>
   <p class="small exp" id="p-err" hidden></p>${has?'<button type="button" class="link" id="p-off" style="color:var(--bad)">Turn off app lock</button>':''}</form>`,sh=>{
   const err=m=>{const e=sh.querySelector('#p-err');e.hidden=false;e.textContent=m};
   const oldOk=async()=>!has||await pinHash(sh.querySelector('#p-old').value)===pinSet();
   sh.querySelector('#pf2').onsubmit=async e=>{e.preventDefault();const a=sh.querySelector('#p-1').value,b=sh.querySelector('#p-2').value;
     if(!await oldOk())return err('Current PIN is wrong.');if(!/^\d{4,8}$/.test(a))return err('Use 4 to 8 digits.');if(a!==b)return err('The two PINs do not match.');
     try{localStorage.setItem('pp-pin',await pinHash(a))}catch(x){}closeSheet();toast('App lock is on')};
   const off=sh.querySelector('#p-off');if(off)off.onclick=async()=>{if(!await oldOk())return err('Type your current PIN first.');try{localStorage.removeItem('pp-pin')}catch(x){}closeSheet();toast('App lock is off')}})}

const REM_KIND={money:['Add today\'s spending','Note what you spent and earned so far today.','expense'],habits:['Tick today\'s habits','Mark the habits you kept today.','habits'],both:['Daily check-in','Add today\'s spending and tick today\'s habits.','money']};
const REMIND={none:'No reminder',at:'At the due time',m10:'10 minutes before',m30:'30 minutes before',h1:'1 hour before',d1:'1 day before',morning:'9:00 AM on the due day'};
function taskAlarmAt(t){if(!t.due||!t.remind||t.remind==='none'||t.status==='done')return 0;const d=pkey(t.due);
  if(t.remind==='morning'||!t.dueTime){d.setHours(9,0,0,0);if(t.remind==='d1')d.setDate(d.getDate()-1);return +d}
  const[h,m]=t.dueTime.split(':').map(Number);d.setHours(h,m,0,0);return +d-({at:0,m10:10,m30:30,h1:60,d1:1440}[t.remind]||0)*60000}
let remT=null;
function syncReminders(){if(!(window.Android&&Android.setReminders))return;clearTimeout(remT);remT=setTimeout(()=>{try{
  const daily=prefs().rem.filter(r=>r.on).map(r=>{const k=REM_KIND[r.kind]||REM_KIND.both;return{id:r.id,hour:r.h,min:r.m,title:k[0],text:k[1],open:k[2]}});
  const once=S.tasks.items.map(t=>({t,at:taskAlarmAt(t)})).filter(x=>x.at>Date.now()).sort((a,b)=>a.at-b.at).slice(0,300)
    .map(({t,at})=>({id:t.id,at,title:'Task: '+t.title,text:(t.dueTime?'Due '+lowDay(t.due)+' at '+fmtTime(t.dueTime):'Due '+lowDay(t.due))+(t.pri==='urgent'||t.pri==='high'?' · '+PRI[t.pri][0]+' priority':''),open:'task:'+t.id}));

function bindReminderInputs(sh){const R=prefs().rem;
  sh.querySelectorAll('[data-rt]').forEach(i=>i.onchange=()=>{const[h,m]=(i.value||'21:00').split(':').map(Number);R[+i.dataset.rt].h=h;R[+i.dataset.rt].m=m;savePrefs();toast('Reminder set for '+fmtTime(i.value))});
  sh.querySelectorAll('[data-rk]').forEach(i=>i.onchange=()=>{R[+i.dataset.rk].kind=i.value;savePrefs()});
  sh.querySelectorAll('[data-ro]').forEach(i=>i.onchange=()=>{R[+i.dataset.ro].on=i.checked;savePrefs()})}
function refreshRemCard(){const c=document.querySelector('.sheet #rem-list');if(!c)return;const card=c.closest('.card');card.outerHTML=remindersCard();bindReminderInputs($('.sheet'))}

/* ---------- open a screen from a notification or the widget ---------- */
window.ppOpen=what=>{try{if(document.querySelector('.sheet'))closeSheet();
  if(what==='expense'||what==='income'){goTab('money');setTimeout(()=>{UI.newType=what==='income'?'inc':'exp';txForm()},350)}
  else if(what==='habits')goTab('habits');else if(what==='money')goTab('money');
  else if(what.startsWith('task:')){const id=what.slice(5);goTab('tlist');if(S.tasks.items.some(t=>t.id===id))setTimeout(()=>taskForm(id),350)}}catch(e){}};

/* ---------- ClickUp-style task extras ---------- */
function fmtDur(min){min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?(h+'h'+(m?' '+m+'m':'')):m+'m'}
function loggedMin(t){return (t.log||[]).reduce((a,l)=>a+(l.e-l.s)/60000,0)+(t.timer?(Date.now()-t.timer)/60000:0)}
function subsOf(t){return S.tasks.items.filter(x=>x.parent===t.id)}
function allTags(){return [...new Set(S.tasks.items.flatMap(t=>t.tags||[]))].sort()}
const REPEAT={none:'Does not repeat',daily:'Every day',weekdays:'Every weekday (Mon–Fri)',weekly:'Every week',monthly:'Every month'};
function nextRepeat(k,rep){let d=pkey(k);if(rep==='daily')return dkey(addDays(d,1));if(rep==='weekly')return dkey(addDays(d,7));
  if(rep==='weekdays'){do{d=addDays(d,1)}while(d.getDay()===0||d.getDay()===6);return dkey(d)}
  return addFreq(k,'monthly')}
function completeTask(t){t.status='done';t.doneAt=Date.now();if(t.timer){(t.log=t.log||[]).push({s:t.timer,e:Date.now()});delete t.timer}
  if(t.repeat&&t.repeat!=='none'&&!t.spawned){const base=t.due||dkey(today());const nd=nextRepeat(base,t.repeat);
    const n={...JSON.parse(JSON.stringify(t)),id:uid(),status:'todo',due:nd,start:t.start?dkey(addDays(pkey(t.start),Math.round((pkey(nd)-pkey(base))/864e5))):'',checks:(t.checks||[]).map(c=>({t:c.t,d:false})),log:[],comments:[],created:Date.now()};
    delete n.doneAt;delete n.spawned;delete n.timer;t.spawned=true;S.tasks.items.push(n);
    subsOf(t).forEach(s=>{const c={...JSON.parse(JSON.stringify(s)),id:uid(),parent:n.id,status:'todo',log:[],created:Date.now()};delete c.doneAt;delete c.timer;S.tasks.items.push(c)});
    toast('Done. Next one is on '+lowDay(nd))}}
function timerBanner(){const t=S.tasks.items.find(x=>x.timer);return t?`<div class="card row" style="background:var(--good-soft);border-color:transparent"><span class="grow small" style="min-width:0"><b>Timer running</b> on ${esc(t.title)} · ${fmtDur(loggedMin(t))}</span><button class="btn sm" data-act="timerStop" data-id="${t.id}">Stop</button></div>`:''}
function tagChips(){const T=allTags();if(!T.length)return '';return `<div class="chips" style="flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none">${T.map(g=>`<button class="chip ${UI.ttag===g?'on':''}" data-act="ttag" data-v="${esc(g)}" style="flex:none"># ${esc(g)}</button>`).join('')}</div>`}
function taskSearch(){return `<label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" type="search" placeholder="Search tasks" value="${esc(UI.tq||'')}"></label>`}
function vTable(){const k=UI.tsort||'due',dir=UI.tdir||1;
  const val={title:t=>t.title.toLowerCase(),status:t=>STATUS.findIndex(s=>s[0]===(t.status||'todo')),pri:t=>PRI[t.pri||'normal'][2],due:t=>(t.due||'9999')+(t.dueTime||''),time:t=>loggedMin(t),list:t=>tlist(t.list).name};
  const L=filtTasks().slice().sort((a,b)=>{const x=val[k](a),y=val[k](b);return (x<y?-1:x>y?1:0)*dir});
  const th=(key,l)=>`<th><button class="link" data-act="tsort" data-v="${key}" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:${k===key?'var(--accent)':'var(--muted)'}">${l}${k===key?(dir>0?' ▲':' ▼'):''}</button></th>`;
  return `${timerBanner()}${listChips()}${tagChips()}${taskSearch()}<div class="card" style="padding:6px"><div class="tbl-wrap"><table><thead><tr>${th('title','Task')}${th('status','Status')}${th('pri','Priority')}${th('due','Due')}${th('time','Time')}${th('list','List')}</tr></thead><tbody>
   ${L.map(t=>`<tr data-act="topen" data-id="${t.id}" style="cursor:pointer"><td style="white-space:normal;min-width:150px;${t.status==='done'?'text-decoration:line-through;color:var(--muted)':''}">${t.parent?'<span class="muted">↳ </span>':''}${esc(t.title)}</td><td>${STATUS.find(s=>s[0]===(t.status||'todo'))[1]}</td><td style="color:${PRI[t.pri||'normal'][1]}">${PRI[t.pri||'normal'][0]}</td><td class="num">${t.due?dueLabel(t.due)+(t.dueTime?' '+fmtTime(t.dueTime):''):'–'}</td><td class="num">${loggedMin(t)||t.est?fmtDur(loggedMin(t))+(t.est?' / '+fmtDur(t.est):''):'–'}</td><td>${esc(tlist(t.list).name)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No tasks</td></tr>'}
   </tbody></table></div></div><p class="note">Tap a column name to sort. Tap a row to open the task.</p>`}

function filtTasks(){const q=(UI.tq||'').trim().toLowerCase();
  return S.tasks.items.filter(t=>(UI.tlist==='all'||t.list===UI.tlist)&&(!UI.ttag||(t.tags||[]).includes(UI.ttag))&&(!q||t.title.toLowerCase().includes(q)||(t.desc||'').toLowerCase().includes(q)||(t.tags||[]).some(g=>g.toLowerCase().includes(q))))}
function taskMeta(t){const k=dkey(today());const od=t.status!=='done'&&t.due&&t.due<k;const p=PRI[t.pri||'normal'];const ck=t.checks||[];const sb=subsOf(t);const lg=loggedMin(t);
  return `<div class="meta">${t.due?`<span class="${od?'od':''}">${od?'Late · ':''}${dueLabel(t.due)}${t.dueTime?' '+fmtTime(t.dueTime):''}</span>`:''}${t.remind&&t.remind!=='none'&&t.status!=='done'?'<span title="Reminder">🔔</span>':''}${t.repeat&&t.repeat!=='none'?'<span title="Repeats">↻</span>':''}${t.pri&&t.pri!=='normal'?`<span class="flag" style="color:${p[1]}">${FLAG(p[1])}${p[0]}</span>`:''}${t.status==='doing'?'<span class="pill" style="background:var(--accent-soft);color:var(--accent);padding:1px 7px">In progress</span>':''}${sb.length?`<span>↳ ${sb.filter(s=>s.status==='done').length}/${sb.length}</span>`:''}${ck.length?`<span>☑ ${ck.filter(c=>c.d).length}/${ck.length}</span>`:''}${lg||t.est?`<span class="${t.timer?'inc':''}">⏱ ${fmtDur(lg)}${t.est?' / '+fmtDur(t.est):''}</span>`:''}${(t.comments||[]).length?`<span>💬 ${t.comments.length}</span>`:''}${(t.tags||[]).map(g=>`<span class="pill flat" style="padding:1px 7px"># ${esc(g)}</span>`).join('')}${UI.tlist==='all'?`<span class="row" style="gap:4px"><i class="dot" style="background:${tlist(t.list).color};width:7px;height:7px"></i>${esc(tlist(t.list).name)}</span>`:''}</div>`}
function vTaskList(){const k=dkey(today()),tm=dkey(addDays(today(),1)),wk=dkey(addDays(today(),7));
  const all=filtTasks().filter(t=>!t.parent||UI.tq).sort(sortT);const open=all.filter(t=>t.status!=='done');const done=all.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const G=[['Late',t=>t.due&&t.due<k,'var(--bad)'],['Today',t=>t.due===k],['Tomorrow',t=>t.due===tm],['Next 7 days',t=>t.due>tm&&t.due<=wk],['Later',t=>t.due>wk],['No date',t=>!t.due]];
  const used=new Set();const groups=G.map(([n,f,c])=>{const L=open.filter(t=>!used.has(t.id)&&f(t));L.forEach(t=>used.add(t.id));return{n,L,c}}).filter(g=>g.L.length);
  if(!S.tasks.items.length)return `${notifBanner()}${listChips()}${quickAdd()}<div class="card empty"><div class="lbl">Tasks</div><h3>Plan your day here</h3><p class="small muted" style="margin:0 auto 14px;max-width:34ch">Type a task above and tap Add. Tap a task to give it a due date and time, reminder, priority, tags, subtasks, a timer and comments. Board, Calendar and Table show the same tasks in other ways.</p><button class="btn ghost" data-act="sampleTasks">Try sample tasks</button></div>`;
  return `${sampleTaskBanner()}${timerBanner()}${listChips()}${tagChips()}${quickAdd()}${taskSearch()}
   ${groups.length?groups.map(g=>`<div><div class="gh"><span style="${g.c?`color:${g.c}`:''}">${g.n}</span><span class="num">${g.L.length}</span></div><div class="grp">${g.L.map(taskRow).join('')}</div></div>`).join(''):`<div class="card empty"><h3>${UI.tq||UI.ttag?'Nothing matches':'All done'}</h3><p class="small muted">No open tasks${UI.tlist==='all'?'':' in this list'}.</p></div>`}
   ${done.length?`<div><button class="link" data-act="toggleDone">${UI.showDone?'Hide':'Show'} completed (${done.length})</button>${UI.showDone?`<div class="grp" style="margin-top:6px">${done.slice(0,50).map(taskRow).join('')}</div>`:''}</div>`:''}
   <p class="note" id="syncNote">${syncText()}</p>`}
function taskForm(id,preset={}){const ex=S.tasks.items.find(x=>x.id===id);const isNew=!ex;
  const t=ex?JSON.parse(JSON.stringify(ex)):{title:'',desc:'',status:'todo',pri:'normal',due:preset.due||'',list:preset.list||(UI.tlist!=='all'?UI.tlist:(S.tasks.lists[0]?.id||'')),checks:[],tags:[],parent:preset.parent||''};
  const estOpts=[0,15,30,45,60,90,120,180,240,360,480];
  const parent=t.parent?S.tasks.items.find(x=>x.id===t.parent):null;
  openSheet(`<h3>${isNew?(t.parent?'New subtask':'New task'):(t.parent?'Subtask':'Task')}</h3><form class="form" id="tkf">
   <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">${isNew?'Add task':'Save'}</button></div>
   ${parent?`<button type="button" class="link" data-act="topen" data-id="${parent.id}" style="text-align:left">↰ Part of: ${esc(parent.title)}</button>`:''}
   <label class="field"><span>Title</span><input class="inp" id="k-t" required maxlength="140" value="${esc(t.title)}" placeholder="What needs doing?"></label>
   <div class="field"><span>Status</span><div class="seg" id="k-st">${STATUS.map(([v,l])=>`<button type="button" data-v="${v}" class="${t.status===v?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="field"><span>Priority</span><div class="seg" id="k-p">${Object.entries(PRI).map(([v,[l,c]])=>`<button type="button" data-v="${v}" class="${t.pri===v?'on':''}"><span class="flag" style="color:${c}">${FLAG(c)}</span> ${l}</button>`).join('')}</div></div>
   <div class="two"><label class="field"><span>Start date</span><input class="inp" type="date" id="k-s" value="${t.start||''}"></label><label class="field"><span>Due date</span><input class="inp" type="date" id="k-d" value="${t.due||''}"></label></div>
   <div class="chips" style="margin-top:-6px"><button type="button" class="chip" data-due="0">Today</button><button type="button" class="chip" data-due="1">Tomorrow</button><button type="button" class="chip" data-due="7">Next week</button><button type="button" class="chip" data-due="">No date</button></div>
   <div class="two"><label class="field"><span>Due time</span><input class="inp" type="time" id="k-tm" value="${t.dueTime||''}"></label><label class="field"><span>Reminder</span><select class="inp" id="k-r">${Object.entries(REMIND).map(([v,l])=>`<option value="${v}" ${(t.remind||'none')===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
   <div class="two"><label class="field"><span>Repeat</span><select class="inp" id="k-rep">${Object.entries(REPEAT).map(([v,l])=>`<option value="${v}" ${(t.repeat||'none')===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>List</span><select class="inp" id="k-l">${S.tasks.lists.map(l=>`<option value="${l.id}" ${l.id===t.list?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label></div>
   <label class="field"><span>Tags (separate with commas)</span><input class="inp" id="k-tags" maxlength="120" value="${esc((t.tags||[]).join(', '))}" placeholder="e.g. exam, urgent, home"></label>
   ${allTags().length?`<div class="chips" style="margin-top:-6px">${allTags().map(g=>`<button type="button" class="chip" data-tag="${esc(g)}"># ${esc(g)}</button>`).join('')}</div>`:''}
   <div class="field"><span>Time</span><div class="row" style="gap:8px;flex-wrap:wrap"><select class="inp" id="k-est" style="flex:1;min-width:140px">${estOpts.map(m=>`<option value="${m}" ${(t.est||0)===m?'selected':''}>${m?'Estimate '+fmtDur(m):'No estimate'}</option>`).join('')}</select>${isNew?'':`<span id="k-time" style="flex:1"></span>`}</div></div>
   <label class="field"><span>Description</span><textarea class="inp" id="k-desc" rows="3" maxlength="4000" placeholder="Notes, links, details">${esc(t.desc||'')}</textarea></label>
   <div class="field"><span>Checklist</span><div class="cklist" id="k-ck"></div><div class="quick" style="margin-top:4px"><input class="inp" id="k-cki" maxlength="120" placeholder="Add an item"><button type="button" class="btn sm ghost" id="k-cka">Add</button></div></div>
   ${isNew||t.parent?'':`<div class="field"><span>Subtasks</span><div id="k-sub"></div><div class="quick" style="margin-top:4px"><input class="inp" id="k-subi" maxlength="140" placeholder="Add a subtask"><button type="button" class="btn sm ghost" id="k-suba">Add</button></div></div>`}
   ${isNew?'':`<div class="field"><span>Comments</span><div id="k-com" class="cklist"></div><div class="quick" style="margin-top:4px"><input class="inp" id="k-comi" maxlength="500" placeholder="Write a comment or update"><button type="button" class="btn sm ghost" id="k-coma">Post</button></div></div>`}
   ${isNew?'':`<button type="button" class="link" id="k-del" style="color:var(--bad)">Delete task</button>`}<div class="confirm"></div></form>`,sh=>{
   const seg=(sel,key)=>sh.querySelectorAll(sel+' button').forEach(b=>b.onclick=()=>{t[key]=b.dataset.v;sh.querySelectorAll(sel+' button').forEach(x=>x.classList.toggle('on',x===b))});seg('#k-st','status');seg('#k-p','pri');
   sh.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{sh.querySelector('#k-d').value=b.dataset.due===''?'':dkey(addDays(today(),+b.dataset.due))});
   sh.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const i=sh.querySelector('#k-tags');const cur=i.value.split(',').map(x=>x.trim()).filter(Boolean);if(!cur.includes(b.dataset.tag))cur.push(b.dataset.tag);i.value=cur.join(', ')});
   const drawCk=()=>{sh.querySelector('#k-ck').innerHTML=t.checks.map((c,i)=>`<div class="ckrow ${c.d?'d':''}"><input type="checkbox" id="ck${i}" data-i="${i}" ${c.d?'checked':''}><label class="txt" for="ck${i}">${esc(c.t)}</label><button type="button" class="link" data-rm="${i}" style="color:var(--muted)" aria-label="Remove item">${ICON.x.replace('<svg','<svg width="16" height="16"')}</button></div>`).join('');
     sh.querySelectorAll('#k-ck input').forEach(c=>c.onchange=()=>{t.checks[+c.dataset.i].d=c.checked;drawCk()});sh.querySelectorAll('#k-ck [data-rm]').forEach(b=>b.onclick=()=>{t.checks.splice(+b.dataset.rm,1);drawCk()})};drawCk();
   const addCk=()=>{const i=sh.querySelector('#k-cki');const v=i.value.trim();if(!v)return;t.checks.push({t:v,d:false});i.value='';drawCk();i.focus()};
   sh.querySelector('#k-cka').onclick=addCk;sh.querySelector('#k-cki').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addCk()}};
   if(ex){
     const drawTime=()=>{const el=sh.querySelector('#k-time');if(!el)return;el.innerHTML=`<span class="row" style="gap:8px"><span class="small"><b class="num">${fmtDur(loggedMin(ex))}</b> tracked</span><button type="button" class="btn sm ${ex.timer?'':'ghost'}" id="k-timer">${ex.timer?'■ Stop':'▶ Start timer'}</button></span>`;
       el.querySelector('#k-timer').onclick=()=>{if(ex.timer){(ex.log=ex.log||[]).push({s:ex.timer,e:Date.now()});delete ex.timer;toast('Timer stopped')}else{S.tasks.items.forEach(o=>{if(o.timer){(o.log=o.log||[]).push({s:o.timer,e:Date.now()});delete o.timer}});ex.timer=Date.now();toast('Timer started')}Store.mark('tasks');drawTime()}};drawTime();
     const tick=setInterval(()=>{if(!document.body.contains(sh)){clearInterval(tick);return}if(ex.timer)drawTime()},30000);
     const drawSubs=()=>{const el=sh.querySelector('#k-sub');if(!el)return;const L=subsOf(ex);el.innerHTML=L.length?`<div class="grp">${L.map(taskRow).join('')}</div>`:'<p class="small muted" style="margin:0">Break this task into smaller steps. Each subtask can have its own date, priority and reminder.</p>'};drawSubs();
     const addSub=()=>{const i=sh.querySelector('#k-subi');const v=i.value.trim();if(!v)return;S.tasks.items.push({id:uid(),title:v,parent:ex.id,list:ex.list,status:'todo',pri:'normal',due:'',checks:[],tags:[],created:Date.now()});i.value='';Store.mark('tasks');drawSubs();i.focus()};
     const sa=sh.querySelector('#k-suba');if(sa){sa.onclick=addSub;sh.querySelector('#k-subi').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSub()}}}
     sh.addEventListener('click',e=>{const b=e.target.closest('#k-sub [data-act=tdone]');if(b)setTimeout(drawSubs,50)});
     const drawCom=()=>{const el=sh.querySelector('#k-com');const C=ex.comments||[];el.innerHTML=C.length?C.slice().reverse().map(c=>{const d=new Date(c.at);return `<div class="card" style="padding:10px"><div class="small muted">${d.getDate()} ${MON[d.getMonth()]}, ${fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()))}</div><div style="overflow-wrap:anywhere;white-space:pre-wrap">${esc(c.text)}</div></div>`}).join(''):'<p class="small muted" style="margin:0">No comments yet.</p>'};drawCom();
     const addCom=()=>{const i=sh.querySelector('#k-comi');const v=i.value.trim();if(!v)return;(ex.comments=ex.comments||[]).push({at:Date.now(),text:v});i.value='';Store.mark('tasks');drawCom()};
     sh.querySelector('#k-coma').onclick=addCom;sh.querySelector('#k-comi').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addCom()}}}
   if(isNew)setTimeout(()=>sh.querySelector('#k-t').focus(),60);
   sh.querySelector('#tkf').onsubmit=e=>{e.preventDefault();const title=sh.querySelector('#k-t').value.trim();if(!title)return;
     const o=ex||{id:uid(),created:Date.now()};const wasDone=o.status==='done';
     Object.assign(o,{title,desc:sh.querySelector('#k-desc').value.trim(),status:t.status,pri:t.pri,start:sh.querySelector('#k-s').value||'',due:sh.querySelector('#k-d').value||'',dueTime:sh.querySelector('#k-tm').value||'',remind:sh.querySelector('#k-r').value,repeat:sh.querySelector('#k-rep').value,list:sh.querySelector('#k-l').value,checks:t.checks,
       tags:[...new Set(sh.querySelector('#k-tags').value.split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean))].slice(0,10),est:+sh.querySelector('#k-est').value||0,parent:t.parent||''});
     if(o.remind!=='none'&&!o.due&&o.status!=='done'){o.due=dkey(today())}
     if(isNew)S.tasks.items.push(o);
     if(o.status==='done'&&!wasDone){o.status='todo';completeTask(o)}else if(o.status!=='done')delete o.doneAt;
     closeSheet();save('tasks');toast(isNew?'Task added':'Saved')};
   const del=sh.querySelector('#k-del');if(del)del.onclick=()=>{const n=subsOf(ex).length;confirmIn(sh,n?`Delete this task and its ${n} subtask${n>1?'s':''}?`:'Delete this task?','Delete',()=>{S.tasks.items=S.tasks.items.filter(x=>x.id!==id&&x.parent!==id);closeSheet();save('tasks');toast('Task deleted')})}})}

function settingsExtra(){return `${remindersCard()}
 <div class="card"><h2>Currency</h2><div class="two"><label class="field"><span>Symbol</span><input class="inp" id="cur-s" maxlength="5" value="${esc(S.money.cur??'Rs')}"></label><label class="field"><span>Decimal places</span><select class="inp" id="cur-d">${[0,1,2].map(n=>`<option value="${n}" ${(+S.money.dec||0)===n?'selected':''}>${n}</option>`).join('')}</select></label></div><p class="small muted" id="cur-ex" style="margin:8px 0 0">Example: ${fmt(1234.5)}</p></div>
 ${window.Android?`<div class="card"><h2>App lock</h2><p class="small muted" style="margin:0 0 10px">${pinSet()?'A PIN is needed to open the app.':'Protect your money and habits with a PIN.'}</p><button class="btn ghost" data-act="pin">${pinSet()?'Change or turn off PIN':'Set a PIN'}</button></div>`:''}
 <div class="card"><h2>Import and export</h2><p class="small muted" style="margin:0 0 10px">Export all records as a spreadsheet file (CSV) that opens in Excel or Google Sheets. Import a CSV exported from the My Money app; records already in this app are skipped.</p><div class="acts"><button class="btn ghost" data-act="csvOut">Export records</button><button class="btn ghost" id="csv-in-b">Import from My Money</button></div><input type="file" id="csv-in" accept=".csv,text/csv,text/comma-separated-values,text/plain" hidden><p class="small" id="csv-msg" style="margin:8px 0 0"></p></div>`}
function bindSettingsExtra(sh){bindReminderInputs(sh);
 const cs=sh.querySelector('#cur-s'),cd=sh.querySelector('#cur-d');const upd=()=>{S.money.cur=cs.value.trim();S.money.dec=+cd.value;Store.mark('money');render();pushWidget();sh.querySelector('#cur-ex').textContent='Example: '+fmt(1234.5)};cs.oninput=upd;cd.onchange=upd;
 const fi=sh.querySelector('#csv-in');sh.querySelector('#csv-in-b').onclick=()=>fi.click();
 fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=sh.querySelector('#csv-msg');try{const x=importMyMoney(String(r.result));m.className='small inc';m.textContent=`Added ${x.added} record${x.added===1?'':'s'}${x.skipped?`, skipped ${x.skipped} already in the app`:''}.`}catch(err){m.className='small exp';m.textContent='This file is not a My Money CSV export. Export again from My Money and pick that file.'}};r.readAsText(f)}}
function totBud(ym){const T=+S.money.totalBudget||0;if(!T)return '';const sp=monthSum(ym).e,r=sp/T;
  return `<div style="margin-bottom:14px"><div class="row small" style="margin-bottom:5px"><b class="grow">All spending</b><span class="num ${r>1?'exp':''}">${fmt(sp)} <span class="muted">/ ${fmt(T)}</span></span></div><div class="bar" style="height:10px"><i style="width:${Math.min(r,1)*100}%;background:${r>1?'var(--bad)':r>.85?'var(--warm)':'var(--accent)'}"></i></div><div class="small ${r>1?'exp':'muted'}" style="margin-top:3px">${r>1?fmt(sp-T)+' over your monthly budget':fmt(T-sp)+' left this month'}</div></div>`}

/* ---------- events ---------- */
document.addEventListener('click',e=>{try{onAct(e)}catch(err){console.error(err);toast('That did not work. Please try again.')}});
function onAct(e){const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='close')return closeSheet();
  if(a==='cell'){const c=S.habits.checks[el.dataset.id]=S.habits.checks[el.dataset.id]||{};if(c[el.dataset.k]!=null)delete c[el.dataset.k];else c[el.dataset.k]=1;
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}return save('habits')}
  if(a==='cellNum')return numEntry(el.dataset.id,el.dataset.k);
  if(a==='openHabit')return habitDetail(el.dataset.id);
  if(a==='editHabit')return habitForm(S.habits.list.find(h=>h.id===el.dataset.id));
  if(a==='newHabit')return habitForm();
  if(a==='quickHabit'){S.habits.list.push({id:uid(),name:el.dataset.n,color:COLORS[S.habits.list.length%COLORS.length],type:'bool',num:1,den:1,target:1,unit:'',created:dkey(today())});return save('habits')}
  if(a==='loadSample')return loadSample();
  if(a==='clearSample')return clearSample();
  if(a==='ym'){UI.ym=shiftYm(UI.ym,+el.dataset.n);return render()}
  if(a==='rym'){UI.rym=shiftYm(UI.rym,+el.dataset.n);return render()}
  if(a==='editTx'){const ym=el.dataset.ym;const t=(S.tx[ym]||[]).find(t=>t.id===el.dataset.id);if(t&&t.type==='ln')return loanPay(t.loan,null,t,ym);return t&&(t.type==='sv'||t.type==='sw'||isSavTx(t))?savingsForm(t,ym):txForm(t,ym)}
  if(a==='saveIn')return savingsForm(null,null,'in',el.dataset.pot);
  if(a==='potDetail')return potDetail(el.dataset.id);
  if(a==='checkUpd')return checkUpdate(true);
  if(a==='doUpdate')return startUpdate();
  if(a==='lf'){UI.lf=el.dataset.v;return render()}
  if(a==='loanDetail')return loanDetail(el.dataset.id);
  if(a==='loanNew')return loanForm(null,el.dataset.dir);
  if(a==='loanEdit')return loanForm(el.dataset.id);
  if(a==='loanPay')return loanPay(el.dataset.id,el.dataset.k);
  if(a==='accDetail')return accDetail(el.dataset.id);
  if(a==='savHist')return savHistory();
  if(a==='saveOut')return savingsForm(null,null,'out',el.dataset.pot);
  if(a==='editPot')return potForm(el.dataset.id);
  if(a==='sub')return goTab(el.dataset.v);
  if(a==='tdone'){const t=S.tasks.items.find(x=>x.id===el.dataset.id);if(!t)return;if(t.status==='done'){t.status='todo';delete t.doneAt}else{completeTask(t);if(!(t.repeat&&t.repeat!=='none'))toast('Done: '+t.title)}if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}return save('tasks')}
  if(a==='topen')return taskForm(el.dataset.id);
  if(a==='tnew')return taskForm(null,{due:el.dataset.due||''});
  if(a==='tmove'){const t=S.tasks.items.find(x=>x.id===el.dataset.id);const i=STATUS.findIndex(s=>s[0]===(t.status||'todo'))+(+el.dataset.n);if(STATUS[i][0]==='done')completeTask(t);else{t.status=STATUS[i][0];delete t.doneAt}return save('tasks')}
  if(a==='tl'){if(el.dataset.v!=='all'&&UI.tlist===el.dataset.v)return listForm(el.dataset.v);UI.tlist=el.dataset.v;return render()}
  if(a==='listForm')return listForm();
  if(a==='toggleDone'){UI.showDone=!UI.showDone;return render()}
  if(a==='cym'){UI.cym=shiftYm(UI.cym,+el.dataset.n);return render()}
  if(a==='csel'){UI.csel=el.dataset.v;if(ymOf(UI.csel)!==UI.cym)UI.cym=ymOf(UI.csel);return render()}
  if(a==='sampleTasks')return sampleTasks();
  if(a==='clearSampleTasks'){S.tasks.items=S.tasks.items.filter(t=>!t.sample);save('tasks');return toast('Sample tasks removed')}
  if(a==='budgets')return budgetsForm();
  if(a==='editAcc')return accForm(el.dataset.id);
  if(a==='editCat')return catForm(el.dataset.id,el.dataset.t);
  if(a==='reorderCats')return reorderCats();
  if(a==='per'){UI.per=el.dataset.v;return render()}
  if(a==='pshift'){UI.pa=perShift(UI.per||'month',UI.pa||dkey(today()),+el.dataset.n);return render()}
  if(a==='rper'){UI.rper=el.dataset.v;return render()}
  if(a==='rshift'){UI.rpa=perShift(UI.rper||'month',UI.rpa||dkey(today()),+el.dataset.n);return render()}
  if(a==='rkind'){UI.rkind=el.dataset.v;return render()}
  if(a==='filters')return filterSheet();
  if(a==='clrF'){UI[el.dataset.k]='';return render()}
  if(a==='recurEdit')return recurForm(el.dataset.id);
  if(a==='askNotif'){try{Android.askNotif()}catch(_){}return}
  if(a==='notifSettings'){try{Android.openNotifSettings()}catch(_){}return}
  if(a==='remAdd'){prefs().rem.push({id:uid(),h:18,m:0,kind:'money',on:true});savePrefs();return refreshRemCard()}
  if(a==='remDel'){prefs().rem.splice(+el.dataset.i,1);savePrefs();return refreshRemCard()}
  if(a==='remTest'){const k=REM_KIND.both;try{Android.testNotif(k[0],k[1],k[2]);toast('Test sent. Check your notifications.')}catch(_){}return}
  if(a==='ttag'){UI.ttag=UI.ttag===el.dataset.v?'':el.dataset.v;return render()}
  if(a==='tsort'){if(UI.tsort===el.dataset.v)UI.tdir=-(UI.tdir||1);else{UI.tsort=el.dataset.v;UI.tdir=1}return render()}
  if(a==='timerStop'){const t=S.tasks.items.find(x=>x.id===el.dataset.id);if(t&&t.timer){(t.log=t.log||[]).push({s:t.timer,e:Date.now()});delete t.timer}return save('tasks')}
  if(a==='pin')return pinSheet();
  if(a==='notifHide'){UI.notifHide=true;return render()}
  if(a==='csvOut')return exportCsv();
  if(a==='unarchive'){const h=S.habits.list.find(x=>x.id===el.dataset.id);if(h)h.archived=false;save('habits');return toast('Habit restored')}
}
document.addEventListener('input',e=>{if(e.target.id==='tq'){UI.tq=e.target.value;const pos=e.target.selectionStart;render();const n=$('#tq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.querySelector('.sheet')&&!$('#lock'))render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
window.addEventListener('error',()=>toast('Something went wrong. Reload the page; your saved data is safe.'));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goTab(UI.last[b.dataset.area]));
$('#fab').onclick=()=>UI.tab==='money'?txForm():UI.tab==='loans'?loanForm():areaOf(UI.tab)==='tasks'?taskForm(null,{due:UI.tab==='tcal'?UI.csel:''}):habitForm();
document.addEventListener('submit',e=>{if(e.target.id!=='qa')return;e.preventDefault();const i=$('#qa-t');const v=i.value.trim();if(!v)return;
  S.tasks.items.push({id:uid(),title:v,desc:'',status:'todo',pri:'normal',due:UI.tlist==='all'?dkey(today()):'',list:UI.tlist!=='all'?UI.tlist:(S.tasks.lists[0]?.id||''),checks:[],created:Date.now()});
  save('tasks');const n=$('#qa-t');if(n)n.focus();toast('Task added')});
$('#settingsBtn').onclick=()=>settingsSheet();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.sheet'))closeSheet()});
/* keep the form's buttons just above the on-screen keyboard */
if(window.visualViewport){const vv=visualViewport,rs=document.documentElement.style;const fit=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);rs.setProperty('--kb',kb+'px');rs.setProperty('--vvh',vv.height+'px')};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}
document.addEventListener('focusin',e=>{const el=e.target;if(el.closest&&el.closest('.sheet')&&/INPUT|TEXTAREA|SELECT/.test(el.tagName))setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},300)});
/* swipe left/right on the screen to move between the tabs of a section */
(()=>{let sx=0,sy=0,st=0,ok=false;const main=$('#main');
  main.addEventListener('touchstart',e=>{if(e.touches.length!==1||document.querySelector('.sheet')){ok=false;return}
    const el=e.target;ok=!el.closest('.board,.accs,.tbl-wrap,.chips,input,textarea,select,svg.chart');
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
  main.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-st>700)return;
    const tabs=AREAS[areaOf(UI.tab)].map(x=>x[0]);const i=tabs.indexOf(UI.tab)+(dx<0?1:-1);if(i<0||i>=tabs.length)return;
    main.classList.remove('slide-l','slide-r');void main.offsetWidth;goTab(tabs[i]);main.classList.add(dx<0?'slide-l':'slide-r')},{passive:true});
})();

['filterSheet','recurForm','pinSheet','loanDetail','loanForm','loanPay','potDetail','accDetail','reorderCats','habitDetail','habitForm','numEntry','txForm','savingsForm','potForm','budgetsForm','accForm','catForm','settingsSheet','taskForm','listForm'].forEach(n=>{window[n]=sheetWrap(window[n])});
Store.loadLocal();
// If this phone's copy is tagged to an account, hold it back until we know who is signed in.
UI.locked=!!Store.loadOwner();
try{const t=sessionStorage.getItem('ah-tab');if(t&&TABS.includes(t))UI.tab=t}catch(e){}
{const h=parseHash();if(h)UI.tab=h.tab;try{location.replace('#'+UI.tab)}catch(e){}}
showLock();
render();
syncReminders();pushWidget();
setInterval(()=>{if(S.tasks.items.some(t=>t.timer)&&!document.querySelector('.sheet')&&areaOf(UI.tab)==='tasks')render()},60000);
connect().catch(()=>{UI.locked=false;UI.sync='error';render()});
// refresh at midnight so "today" moves on
setInterval(()=>{const k=dkey(today());if(k!==UI.lastDay){UI.lastDay=k;if(!document.querySelector('.sheet'))render()}},60000);UI.lastDay=dkey(today());
</script>
