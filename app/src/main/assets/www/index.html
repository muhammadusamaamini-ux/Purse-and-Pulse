<style>
/* Layout: one-screen phone app — sticky top bar, scrolling content, fixed bottom tab bar, bottom sheets for entry */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E8EEEB; --fg:#14201C; --muted:#5B6964; --line:#D6DFDB;
  --accent:#1F4E8C; --accent-fg:#FFFFFF; --accent-soft:#DDE7F5;
  --good:#1B7F47; --good-soft:#DDF1E5; --bad:#BD3B26; --bad-soft:#F8E1DC; --warm:#B87A0B; --warm-soft:#F6EBD3;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 6px 20px rgba(20,32,28,.06);
  --f-display:"Google Sans","Product Sans",Roboto,system-ui,sans-serif;
  --f-body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --surface2:#212B28; --fg:#E7EEEB; --muted:#93A29C; --line:#2B3632;
  --accent:#8AB0EC; --accent-fg:#0D1626; --accent-soft:#1E2B42;
  --good:#5CCB8A; --good-soft:#173525; --bad:#F2846D; --bad-soft:#3A1E18; --warm:#E9B451; --warm-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --surface2:#212B28; --fg:#E7EEEB; --muted:#93A29C; --line:#2B3632;
  --accent:#8AB0EC; --accent-fg:#0D1626; --accent-soft:#1E2B42;
  --good:#5CCB8A; --good-soft:#173525; --bad:#F2846D; --bad-soft:#3A1E18; --warm:#E9B451; --warm-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;overflow-x:hidden;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;flex:1;text-wrap:balance}
.top .sub{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn{position:relative}.syncdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.syncdot.cloud{background:var(--good)}.syncdot.error{background:var(--bad)}.syncdot.loading{background:var(--warm)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;padding:10px 0;flex:1;min-width:0;font-size:15px;outline:none}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-weight:700}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2,.sec-h{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.pill.up{background:var(--good-soft);color:var(--good)}
.pill.down{background:var(--bad-soft);color:var(--bad)}
.pill.flat{background:var(--surface2);color:var(--muted)}
.pill.sample{background:var(--warm-soft);color:var(--warm)}

/* habit grid (Loop style) */
.hgrid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hhead,.hrow{display:grid;grid-template-columns:minmax(0,1fr) 56px;align-items:center;column-gap:2px;padding:0 8px 0 12px}
.hhead{padding-block:10px 6px;border-bottom:1px solid var(--line)}
.hhead .d{text-align:center;font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.hhead .d b{display:block;font-size:14px;color:var(--fg);font-weight:700}
.hhead .d.today b{color:var(--accent)}
.hrow{min-height:58px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hname{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:8px 0;text-align:left}
.hname .t{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.hname .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{flex:none}
.cell{width:46px;height:46px;border:2px solid var(--line)!important;margin:auto;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;font-size:12px;font-weight:700}
.cell svg{width:24px;height:24px}.cell.on{border-color:transparent!important}
.cell.off{color:var(--line)}
.cell.part{opacity:.55}
.empty{text-align:center;padding:28px 18px}
.empty h3{font-family:var(--f-display);font-size:20px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.kpi .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
tr:last-child td{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.verdict{display:flex;gap:12px;align-items:center}
.verdict .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2);display:block;max-width:100%}

/* money */
.month{display:flex;align-items:center;justify-content:space-between}
.month b{font-family:var(--f-display);font-size:18px}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sumrow .v{font-weight:700;font-size:16px}
.inc{color:var(--good)} .exp{color:var(--bad)}
.accs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.acc{flex:none;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.acc .n{font-size:12px;color:var(--muted);font-weight:600}
.acc .v{font-weight:700}
.bud{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding:10px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.txlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tx:last-child{border-bottom:0}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.tx .t{font-weight:600}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px}
.subtabs button{border:0;background:none;padding:8px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* tasks */
.tk{display:flex;align-items:flex-start;gap:12px;padding:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tk:last-child{border-bottom:0}
.tk .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;margin-top:1px;padding:0}
.tk .chk svg{width:16px;height:16px}
.tk .chk.done{background:var(--good);border-color:var(--good);color:#fff}
.tk .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.tk .tt{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.tk.isdone .tt{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:4px;align-items:center}
.meta .od{color:var(--bad);font-weight:600}
.flag{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.grp{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 2px 6px}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -4px;padding-inline:4px}
.col{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--surface2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.col h4{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.bcard .tt{font-weight:600;overflow-wrap:anywhere;margin-bottom:2px}
.bmove{display:flex;justify-content:space-between;margin-top:8px}
.bmove button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--surface);border-radius:10px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:13px;max-width:100%}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent);color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-fg)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cklist{display:flex;flex-direction:column;gap:6px}
.ckrow{display:flex;align-items:center;gap:8px}
.ckrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
.ckrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.ckrow.d .txt{text-decoration:line-through;color:var(--muted)}
.tab{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(31,78,140,.35)}
.fab svg{width:26px;height:26px}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:41;max-height:calc(var(--vvh,100vh) * .92);overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:21px;margin:0 0 14px;font-weight:700}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp.amount{font-family:var(--f-display);font-size:30px;font-weight:700;padding:10px 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px}
.acts .btn{flex:1}
.sheet .acts.top{position:sticky;top:-8px;z-index:3;background:var(--surface);margin:-4px -16px 0;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60}
.note{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend .row{gap:8px}
.calcwrap{margin-top:-6px}
.calcbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cb{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700;color:var(--fg);padding:0;touch-action:manipulation}
.cb.eq{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.calcres{min-height:18px;margin-top:4px;font-weight:600}
.icb{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--surface2);font-size:22px;display:grid;place-items:center;padding:0}
.icb.on{border-color:var(--accent);background:var(--accent-soft)}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
.lockin{text-align:center;width:100%;max-width:300px}
.lkdots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}.lkdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:block}.lkdots i.on{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}.pad button{height:62px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600}
input[type=time].inp{min-height:46px}
@media (prefers-reduced-motion:no-preference){.slide-l{animation:sl .2s ease-out}.slide-r{animation:sr .2s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.4}}@keyframes sr{from{transform:translateX(-24px);opacity:.4}}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

  <button class="tab" data-area="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Tasks</button>
</div></nav>
<div id="sheetRoot"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pkey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymOf=k=>k.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=n=>{const m=S.money||{};const c=m.cur??'Rs',dp=+m.dec||0;const a=Math.abs(+n||0);return (n<0?'−':'')+(c?c+' ':'')+a.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})};
const fmtK=n=>{const a=Math.abs(n);return a>=100000?(n/100000).toFixed(a>=1e6?0:1)+'L':a>=1000?(n/1000).toFixed(a>=10000?0:1)+'k':String(Math.round(n))};
const pct=x=>Math.round(x*100)+'%';
const COLORS=['#2F7D5B','#1F6FB2','#B4432F','#8A4FBF','#C98A12','#0E8C8C','#C2457A','#5C6E22','#6B5B4B','#3D5A99'];
const ICON={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'};

/* ---------- state ---------- */
function defaultMoney(){
  const ex=[['Food',0],['Groceries',1],['Transport',2],['Bills & utilities',3],['Mobile & internet',4],['Rent',5],['Shopping',6],['Health',7],['Education',8],['Family',9],['Charity & sadqa',0],['Other',8]];
  const inc=[['Salary',0],['Business',1],['Gift',3],['Other income',5]];
  return {accounts:[{id:'cash',name:'Cash',start:0},{id:'bank',name:'Bank',start:0},{id:'wallet',name:'Mobile wallet',start:0}],
    cats:[...ex.map(([n,c],i)=>({id:'e'+i,name:n,type:'exp',color:COLORS[c]})),...inc.map(([n,c],i)=>({id:'i'+i,name:n,type:'inc',color:COLORS[c]}))],
    budgets:{},pots:[{id:'pot1',name:'General savings',target:0,date:'',color:COLORS[1]}]};
}
function defaultTasks(){return{lists:[{id:'l1',name:'Personal',color:COLORS[1]},{id:'l2',name:'Study',color:COLORS[4]},{id:'l3',name:'Work',color:COLORS[0]}],items:[]}}
let S={habits:{list:[],checks:{}},money:defaultMoney(),tx:{},tasks:defaultTasks()};
let UI={tab:'money',tlist:'all',showDone:false,cym:dkey(today()).slice(0,7),csel:dkey(today()),ym:dkey(today()).slice(0,7),rym:dkey(today()).slice(0,7),sync:'local'};

/* ---------- storage: per-person database, with on-device copy ---------- */
const LKEY='amal-hisaab-v1',OKEY='amal-hisaab-owner';
function freshState(){return{habits:{list:[],checks:{}},money:defaultMoney(),tx:{},tasks:defaultTasks()}}
const Store={col:null,timers:{},busy:{},again:{},owner:null,
  loadOwner(){try{this.owner=localStorage.getItem(OKEY)}catch(e){this.owner=null}return this.owner},
  setOwner(id){this.owner=id;try{localStorage.setItem(OKEY,id)}catch(e){}},
  clearLocal(){try{localStorage.removeItem(LKEY)}catch(e){}},
  loadLocal(){try{const r=localStorage.getItem(LKEY);if(r){const o=JSON.parse(r);if(o&&o.habits&&o.money)S=Object.assign({tx:{},tasks:defaultTasks()},o)}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}},
  docData(id){if(id==='habits')return S.habits;if(id==='money')return S.money;if(id==='tasks')return S.tasks;return{items:S.tx[id.slice(3)]||[]}},
  pending(id){return !!(this.timers[id]||this.busy[id])},
  mark(id){this.saveLocal();if(!this.col)return;clearTimeout(this.timers[id]);this.timers[id]=setTimeout(()=>{this.timers[id]=null;this.flush(id)},450)},
  async flush(id){if(this.busy[id]){this.again[id]=true;return}this.busy[id]=true;
    try{await this.col.doc(id).set(this.docData(id));setSync('cloud')}catch(e){setSync('error')}
    this.busy[id]=false;if(this.again[id]){this.again[id]=false;this.flush(id)}}
};
function save(...ids){ids.forEach(id=>Store.mark(id));render();pushWidget();if(ids.includes('tasks')||ids.includes('prefs'))syncReminders()}
function setSync(s){UI.sync=s;const el=$('#syncNote');if(el)el.textContent=syncText();const d=$('#syncdot');if(d)d.className='syncdot '+s}
function syncText(){return UI.sync==='cloud'?'Saved to your account — opens with your data on any device.':UI.sync==='error'?'Could not reach your account. Changes are kept on this phone and will sync when you are back online.':UI.sync==='loading'?'Connecting to your account…':(window.PP_STANDALONE?'Saved on this phone only, no internet needed. Make a backup from Settings now and then so you never lose it.':'Saved on this device.')}

async function connect(){
  if(window.PP_STANDALONE){UI.locked=false;UI.sync='local';render();return}
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  const unlock=()=>{UI.locked=false;UI.sync='local';render()};
  if(!window.claude||!window.claude.use)return unlock();
  UI.sync='loading';
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return unlock();
  const id=await user.id(); if(!id)return unlock();
  // The copy on this phone belongs to one account only. If a different account
  // signs in here, drop that copy instead of showing it or uploading it.
  const owner=Store.owner;let mayUpload=true;
  if(owner&&owner!==id){S=freshState();Store.clearLocal();mayUpload=false}
  Store.setOwner(id);UI.locked=false;render();
  const col=db.collection('data/users/'+id);Store.col=col;
  let first=true;const timer=setTimeout(()=>{if(first){setSync('error')}},10000);
  col.onSnapshot(snap=>{
    const ids=new Set(snap.docs.map(d=>d.id));
    if(first&&!snap.metadata.fromCache){first=false;clearTimeout(timer);
      if(snap.empty){ // first time: push what this phone has
        const hasLocal=S.habits.list.length||Object.keys(S.tx).length||S.tasks.items.length;
        if(hasLocal&&mayUpload){Store.mark('habits');Store.mark('money');Store.mark('tasks');Object.keys(S.tx).forEach(m=>Store.mark('tx-'+m))}
        setSync('cloud');return}
      setSync('cloud')}
    if(snap.empty)return;
    let changed=false;
    snap.docs.forEach(d=>{if(!d.exists||Store.pending(d.id))return;const v=JSON.parse(JSON.stringify(d.data()||{}));
      if(d.id==='habits'){S.habits={list:v.list||[],checks:v.checks||{}};changed=true}
      else if(d.id==='money'){S.money=Object.assign(defaultMoney(),v);changed=true}
      else if(d.id==='tasks'){S.tasks={lists:v.lists||defaultTasks().lists,items:v.items||[]};changed=true}
      else if(d.id.startsWith('tx-')){S.tx[d.id.slice(3)]=v.items||[];changed=true}});
    Object.keys(S.tx).forEach(m=>{if(!ids.has('tx-'+m)&&!Store.pending('tx-'+m)&&!first)delete S.tx[m]});
    if(changed){Store.saveLocal();if(!document.querySelector('.sheet'))render()}
  },()=>{clearTimeout(timer);setSync('error')});
}

/* ---------- habit math (Loop-style score) ---------- */
function freqOf(h){return (h.num||1)/(h.den||1)}
function rawVal(h,k){const v=(S.habits.checks[h.id]||{})[k];if(v==null)return 0;return h.type==='num'?Math.min(v/(h.target||1),1):1}
function doneOn(h,k){const v=(S.habits.checks[h.id]||{})[k];if(v==null)return false;return h.type==='num'?v>=(h.target||1):true}
function satisfied(h,d){ // day counts as success if habit target met (daily) or weekly quota met in window
  if(freqOf(h)>=1)return doneOn(h,dkey(d));
  let c=0;for(let i=0;i<h.den;i++)if(doneOn(h,dkey(addDays(d,-i))))c++;return c>=h.num}
function startOf(h){const ks=Object.keys(S.habits.checks[h.id]||{}).sort();const c=h.created?pkey(h.created):today();const f=ks.length?pkey(ks[0]):c;return f<c?f:c}
function scoreSeries(h,days){ // returns [{d,score}] ending today
  const mult=Math.pow(0.5,Math.sqrt(freqOf(h))/13);const end=today();let d=startOf(h);let s=0;const out=[];
  const from=addDays(end,-(days-1));
  while(d<=end){const k=dkey(d);let v;
    if(h.type==='num')v=rawVal(h,k);else v=freqOf(h)>=1?(doneOn(h,k)?1:0):(satisfied(h,d)?1:0);
    s=s*mult+v*(1-mult);if(d>=from)out.push({d:new Date(d),s});d=addDays(d,1)}
  while(out.length<days){out.unshift({d:addDays(out.length?out[0].d:end,-1),s:0})}
  return out}
function strength(h){const s=scoreSeries(h,1);return s[s.length-1].s}
function strengthAgo(h,n){const s=scoreSeries(h,n+1);return s[0].s}
function streaks(h){const st=startOf(h);let best=0,run=0,cur=0;let d=new Date(st);const end=today();
  while(d<=end){if(satisfied(h,d)){run++;if(run>best)best=run}else run=0;d=addDays(d,1)}
  // current: count back from today (today not yet done doesn't break it)
  d=today();if(!satisfied(h,d))d=addDays(d,-1);while(d>=st&&satisfied(h,d)){cur++;d=addDays(d,-1)}
  return{cur,best}}
function rate(h,days,offset=0){let ok=0,n=0;const st=startOf(h);
  for(let i=offset;i<offset+days;i++){const d=addDays(today(),-i);if(d<st)break;n++;if(satisfied(h,d))ok++}
  return n?ok/n:null}
function trendOf(h){const a=rate(h,14,0),b=rate(h,14,14);const sNow=strength(h),sThen=strengthAgo(h,14);
  const diff=sNow-sThen;return{diff,dir:diff>0.03?'up':diff<-0.03?'down':'flat',a,b}}
function freqText(h){if(h.type==='num')return (h.target||1)+' '+(h.unit||'')+' a day';
  if((h.num||1)===(h.den||1))return 'Every day';if(h.den===7)return h.num+' times a week';if(h.num===1)return 'Every '+h.den+' days';return h.num+' times in '+h.den+' days'}

/* ---------- money math ---------- */
function allTx(){return Object.values(S.tx).flat()}
function monthTx(ym){return (S.tx[ym]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.t||0)-(a.t||0))}
function pot(id){return (S.money.pots||[]).find(p=>p.id===id)||{name:'Savings',color:COLORS[1]}}
/* Savings and the Savings account are the same money. Goals split it; General savings holds whatever isn't set aside for another goal. */
function savId(){const a=S.money.accounts.find(x=>x.id==='sav');return a?a.id:null}
function ensureSav(){if(savId())return false;S.money.accounts.splice(Math.min(1,S.money.accounts.length),0,{id:'sav',name:'Savings',start:0});return true}
function genPot(){const P=S.money.pots||(S.money.pots=[]);if(!P.length)P.push({id:'pot1',name:'General savings',target:0,date:'',color:COLORS[1]});return P.find(p=>p.id==='pot1')||P[0]}
function savDelta(t){const s=savId();if(!s)return 0;if(t.type==='tr'){if(t.to===s&&t.acc!==s)return t.amt;if(t.acc===s&&t.to!==s)return -t.amt;return 0}if(t.acc!==s)return 0;return t.type==='inc'||(t.type==='ln'&&t.mv==='in')?t.amt:t.type==='exp'||(t.type==='ln'&&t.mv==='out')?-t.amt:0}
function savTx(){const s=savId();return s?allTx().filter(t=>t.acc===s||t.to===s):[]}
function isSavTx(t){const s=savId();return !!s&&t.type==='tr'&&(t.to===s||t.acc===s)}
function potOf(t){return t.pot&&(S.money.pots||[]).some(p=>p.id===t.pot)?t.pot:genPot().id}
function potItems(id){return savTx().filter(t=>potOf(t)===id)}
function potStart(id){return id===genPot().id?(+acc(savId()).start||0):0}
function potBal(id){return potStart(id)+potItems(id).reduce((a,t)=>a+savDelta(t),0)}
function migrateSav(){ // older "sv/sw" savings records become transfers into / out of the Savings account
  const ch=new Set();if(ensureSav())ch.add('money');const s=savId();
  Object.entries(S.tx).forEach(([m,L])=>L.forEach(t=>{if(t.type==='sv'){t.type='tr';t.to=s;ch.add('tx-'+m)}else if(t.type==='sw'){t.type='tr';t.to=t.acc;t.acc=s;ch.add('tx-'+m)}}));
  ch.forEach(id=>Store.mark(id))}
function txName(t){if(t.type==='ln'){const l=loanById(t.loan);return l?lnLabel(t,l):'Loan'}const s=savId(),gn=(S.money.pots||[]).length>1?' · '+pot(potOf(t)).name:'';
  if(t.type==='tr'&&s&&t.to===s)return 'Added to savings'+gn;if(t.type==='tr'&&s&&t.acc===s)return 'Taken from savings'+gn;
  return t.type==='tr'?'Transfer':t.type==='sv'?'Saved · '+pot(t.pot).name:t.type==='sw'?'From savings · '+pot(t.pot).name:cat(t.cat).name}
function monthsLeft(dateStr){if(!dateStr)return null;const d=pkey(dateStr),t=today();return (d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth())+(d.getDate()>=t.getDate()?1:0)}
function cat(id){return S.money.cats.find(c=>c.id===id)||{name:'Uncategorised',color:'#6B5B4B',type:'exp'}}
function acc(id){return S.money.accounts.find(a=>a.id===id)||{name:'Account'}}
function balances(){const b={};S.money.accounts.forEach(a=>b[a.id]=+a.start||0);
  allTx().forEach(t=>{if(t.type==='exp')b[t.acc]=(b[t.acc]||0)-t.amt;else if(t.type==='inc')b[t.acc]=(b[t.acc]||0)+t.amt;else if(t.type==='sv')b[t.acc]=(b[t.acc]||0)-t.amt;else if(t.type==='sw')b[t.acc]=(b[t.acc]||0)+t.amt;else if(t.type==='ln')b[t.acc]=(b[t.acc]||0)+(t.mv==='in'?t.amt:-t.amt);else{b[t.acc]=(b[t.acc]||0)-t.amt;b[t.to]=(b[t.to]||0)+t.amt}});return b}
function monthSum(ym){let i=0,e=0,sv=0;(S.tx[ym]||[]).forEach(t=>{if(t.type==='inc')i+=t.amt;else if(t.type==='exp')e+=t.amt;else if(t.type==='sv')sv+=t.amt;else if(t.type==='sw')sv-=t.amt});return{i,e,b:i-e,sv}}
function shiftYm(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function ymLabel(ym){const[y,m]=ym.split('-').map(Number);return MON[m-1]+' '+y}
function byCat(ym){const o={};(S.tx[ym]||[]).forEach(t=>{if(t.type==='exp')o[t.cat]=(o[t.cat]||0)+t.amt});return o}

/* ---------- charts (SVG) ---------- */
function lineChart(points,{h=150,color='var(--accent)',yMax=1,yFmt=v=>pct(v),labels=[]}={}){
  const W=340,P={l:34,r:8,t:10,b:22},iw=W-P.l-P.r,ih=h-P.t-P.b;const n=points.length;
  const x=i=>P.l+(n<=1?0:i*iw/(n-1)),y=v=>P.t+ih-(v/yMax)*ih;
  let g='';[0,.25,.5,.75,1].forEach(f=>{const yy=y(f*yMax);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${yy+3}" text-anchor="end">${yFmt(f*yMax)}</text>`});
  const path=points.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
  const area=path+`L${x(n-1)},${y(0)}L${x(0)},${y(0)}Z`;
  labels.forEach(([i,t])=>{g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${t}</text>`});
  const last=points[n-1]||0;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<path d="${area}" fill="${color}" opacity=".12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(last)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`}
function barChart(vals,{h=150,colors,labels=[],yFmt=fmtK,max,series2}={}){
  const W=340,P={l:34,r:6,t:10,b:22},iw=W-P.l-P.r,ih=h-P.t-P.b,n=vals.length;
  const m=max||Math.max(1,...vals,...(series2||[]))*1.1;const nice=niceMax(m);
  const bw=iw/n;let g='';[0,.5,1].forEach(f=>{const yy=P.t+ih-f*ih;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${P.l-6}" y="${yy+3}" text-anchor="end">${yFmt(f*nice)}</text>`});
  vals.forEach((v,i)=>{const hh=v/nice*ih;
    if(series2){const w=Math.max(2,bw*0.34);const h2=series2[i]/nice*ih;
      g+=`<rect x="${P.l+i*bw+bw/2-w-1}" y="${P.t+ih-hh}" width="${w}" height="${Math.max(0,hh)}" rx="2" fill="var(--good)"/><rect x="${P.l+i*bw+bw/2+1}" y="${P.t+ih-h2}" width="${w}" height="${Math.max(0,h2)}" rx="2" fill="var(--bad)"/>`}
    else{const w=Math.max(2,bw*0.62);g+=`<rect x="${P.l+i*bw+(bw-w)/2}" y="${P.t+ih-hh}" width="${w}" height="${Math.max(0,hh)}" rx="2.5" fill="${colors?colors[i]:'var(--accent)'}"/>`}});
  labels.forEach(([i,t])=>{g+=`<text x="${P.l+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${t}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`}
function niceMax(m){if(m<=1)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));for(const s of[1,1.5,2,2.5,3,4,5,6,8,10])if(s*p>=m)return s*p;return 10*p}
function donut(parts,total,center){const R=58,C=2*Math.PI*R;let off=0,seg='';
  parts.forEach(p=>{const L=total?p.v/total*C:0;seg+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=L});
  if(!parts.length)seg=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--surface2)" stroke-width="22"/>`;
  return `<svg viewBox="0 0 160 160" width="150" height="150" style="flex:none;max-width:100%">${seg}<text x="80" y="76" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--f-body)">Spent</text><text x="80" y="96" text-anchor="middle" style="fill:var(--fg);font-size:17px;font-weight:700;font-family:var(--f-display)">${center}</text></svg>`}
function ring(v,color,size=30){const r=size/2-3.5,C=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function heatmap(h,weeks=18){const end=today();const startD=addDays(end,-(end.getDay())-7*(weeks-1));let cells='';
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const day=addDays(startD,w*7+d);if(day>end){cells+='<i style="background:transparent"></i>';continue}
    const k=dkey(day);const v=rawVal(h,k);cells+=`<i title="${k}" style="${v?`background:${h.color};opacity:${0.35+0.65*v}`:''}"></i>`}
  const mlabels=[];for(let w=0;w<weeks;w++){const day=addDays(startD,w*7);if(day.getDate()<=7)mlabels.push(`<span style="grid-column:${w+1}">${MON[day.getMonth()]}</span>`)}

function vInsights(){
  const hs=S.habits.list.filter(h=>!h.archived);
  if(!hs.length)return `<div class="card empty"><h3>No habits yet</h3><p class="muted small">Add habits on the Habits tab, mark them for a few days, and your analysis shows up here.</p><button class="btn" data-act="loadSample">Try sample data</button></div>`;
  // overall daily completion % last 60 days
  const N=60,daily=[];for(let i=N-1;i>=0;i--){const d=addDays(today(),-i);const act=hs.filter(h=>startOf(h)<=d);daily.push(act.length?act.filter(h=>satisfied(h,d)).length/act.length:0)}
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const smooth=daily.map((_,i)=>avg(daily.slice(Math.max(0,i-6),i+1)));
  const last14=avg(daily.slice(-14)),prev14=avg(daily.slice(-28,-14));const diff=last14-prev14;
  const avgStr=avg(hs.map(strength)),avgStrThen=avg(hs.map(h=>strengthAgo(h,14)));
  const dir=diff>0.03?'up':diff<-0.03?'down':'flat';
  const verdict={up:['Improving','You completed more of your habits in the last two weeks than the two weeks before.'],down:['Slipping','You completed fewer habits in the last two weeks. Pick the weakest one below and focus on it.'],flat:['Holding steady','Your completion rate is about the same as the two weeks before.']}[dir];
  const lbls=[];for(let i=0;i<N;i+=14){const d=addDays(today(),-(N-1-i));lbls.push([i,d.getDate()+' '+MON[d.getMonth()]])}
  // weekly bars last 10 weeks
  const W=10,wk=[],wl=[];for(let w=W-1;w>=0;w--){let ok=0,n=0;for(let i=0;i<7;i++){const d=addDays(today(),-(w*7+i));hs.forEach(h=>{if(startOf(h)<=d){n++;if(satisfied(h,d))ok++}})}wk.push(n?ok/n:0);const d=addDays(today(),-w*7-6);wl.push([W-1-w,d.getDate()+'/'+(d.getMonth()+1)])}
  // weekday pattern
  const wdOk=Array(7).fill(0),wdN=Array(7).fill(0);for(let i=0;i<84;i++){const d=addDays(today(),-i);hs.forEach(h=>{if(startOf(h)<=d){wdN[d.getDay()]++;if(satisfied(h,d))wdOk[d.getDay()]++}})}
  const wdR=wdOk.map((o,i)=>wdN[i]?o/wdN[i]:0);const bestWd=wdR.indexOf(Math.max(...wdR)),worstWd=wdR.indexOf(Math.min(...wdR));
  const rows=hs.map(h=>({h,s:strength(h),t:trendOf(h),r7:rate(h,7),r30:rate(h,30),st:streaks(h)})).sort((a,b)=>b.s-a.s);
  return `${sampleBanner()}<div class="card"><div class="verdict"><div class="grow"><div class="lbl">Overall, last 14 days</div><div class="big ${dir==='up'?'inc':dir==='down'?'exp':''}">${verdict[0]}</div></div><span class="pill ${dir}">${dir==='up'?'▲':dir==='down'?'▼':'■'} ${Math.abs(Math.round(diff*100))} pts</span></div>
    <p class="small muted" style="margin:8px 0 12px">${verdict[1]}</p>
    <div class="kpis"><div class="kpi"><div class="v num">${pct(last14)}</div><div class="k">Done, 14 days</div></div><div class="kpi"><div class="v num">${pct(prev14)}</div><div class="k">Previous 14</div></div><div class="kpi"><div class="v num">${pct(avgStr)}</div><div class="k">Avg strength</div></div></div></div>
  <div class="card"><h2>Daily completion</h2><div class="small muted" style="margin:-6px 0 8px">7-day average, last 60 days</div>${lineChart(smooth,{labels:lbls})}</div>
  <div class="card"><h2>Week by week</h2><div class="small muted" style="margin:-6px 0 8px">Share of habit-days completed</div>${barChart(wk,{max:1,yFmt:v=>pct(v),labels:wl.filter((_,i)=>i%2===0)})}</div>
  <div class="card"><h2>Best and worst days</h2><div class="small muted" style="margin:-6px 0 8px">Last 12 weeks. You are strongest on <b style="color:var(--fg)">${WD[bestWd]}</b> and weakest on <b style="color:var(--fg)">${WD[worstWd]}</b>.</div>${barChart(wdR,{max:1,yFmt:v=>pct(v),labels:WD.map((w,i)=>[i,w]),colors:wdR.map((_,i)=>i===worstWd?'var(--bad)':i===bestWd?'var(--good)':'var(--accent)')})}</div>
  <div class="card"><h2>Habit table</h2><div class="tbl-wrap"><table><thead><tr><th>Habit</th><th>Strength</th><th>Trend</th><th>7 d</th><th>30 d</th><th>Streak</th><th>Best</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-act="openHabit" data-id="${r.h.id}" style="cursor:pointer"><td><span class="row" style="gap:8px"><i class="dot" style="background:${r.h.color}"></i>${esc(r.h.name)}</span></td><td class="num">${pct(r.s)}</td><td><span class="pill ${r.t.dir}">${r.t.dir==='up'?'▲':r.t.dir==='down'?'▼':'■'} ${Math.abs(Math.round(r.t.diff*100))}</span></td><td class="num">${r.r7==null?'–':pct(r.r7)}</td><td class="num">${r.r30==null?'–':pct(r.r30)}</td><td class="num">${r.st.cur}</td><td class="num">${r.st.best}</td></tr>`).join('')}
  </tbody></table></div><p class="small muted" style="margin:10px 0 0">Trend is the change in strength over the last 14 days, in points.</p></div>`}

function vCal(){const ym=UI.cym;const[y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1);const start=addDays(first,-first.getDay());const k=dkey(today());

  try{const r=await fetch('https://api.github.com/repos/'+PP_REPO+'/releases/latest',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();const n=parseInt(String(d.tag_name||'').split('.').pop(),10);const a=(d.assets||[]).find(x=>/\.apk$/i.test(x.name));
    UI.update=(n>v.code&&a)?{code:n,name:String(d.tag_name).replace(/^v/,''),url:a.browser_download_url,file:a.name}:null;

    if(manual){if(st())st().textContent=UI.update?'Version '+UI.update.name+' is available.':'You have the latest version.';toast(UI.update?'Version '+UI.update.name+' is available':'You have the latest version');if(UI.update&&document.querySelector('.sheet [data-act=checkUpd]')&&!document.querySelector('.sheet [data-act=doUpdate]'))document.querySelector('.sheet [data-act=checkUpd]').insertAdjacentHTML('afterend','<button class="btn" data-act="doUpdate">Update now</button>')}

  catch(e){if(manual){if(st())st().textContent='';toast('Could not check. Connect to the internet and try again.')}}}

  let last=0;try{last=+localStorage.getItem('pp-upd-checked')||0}catch(e){}

/* ---------- calculator in amount boxes: 200+300+450 ---------- */
function calcEval(src){const s=String(src).replace(/,/g,'').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
  if(!s)return null;if(!/^[0-9.+\-*/()]+$/.test(s))return NaN;let i=0;
  const num=()=>{const m=s.slice(i).match(/^\d*\.?\d+|^\d+\./);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const fac=()=>{if(s[i]==='-'){i++;return -fac()}if(s[i]==='+'){i++;return fac()}if(s[i]==='('){i++;const v=add();if(s[i]!==')')throw 0;i++;return v}return num()};
  const mul=()=>{let v=fac();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v};
  const add=()=>{let v=mul();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=mul();v=o==='+'?v+r:v-r}return v};
  try{const v=add();if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}}
function enhanceCalc(sh){sh.querySelectorAll('#t-amt,#s-amt,#ln-a,#lp-a,#r-a').forEach(inp=>{if(inp.dataset.calc)return;inp.dataset.calc='1';
  inp.type='text';inp.setAttribute('inputmode','decimal');inp.setAttribute('autocomplete','off');inp.removeAttribute('min');inp.removeAttribute('step');
  const host=inp.closest('label')||inp;const bar=document.createElement('div');bar.className='calcwrap';
  bar.innerHTML=`<div class="calcbar">${['+','−','×','÷','(',')'].map(o=>`<button type="button" class="cb" data-op="${o}" aria-label="${{'+':'plus','−':'minus','×':'times','÷':'divide','(':'open bracket',')':'close bracket'}[o]}">${o}</button>`).join('')}<button type="button" class="cb eq" data-op="=" aria-label="equals">=</button></div><div class="calcres small muted" aria-live="polite"></div>`;
  host.after(bar);const res=bar.querySelector('.calcres');
  const show=()=>{const v=inp.value;if(!/[+\-*/×÷−()]/.test(v.replace(/^-/,''))){res.textContent='';return}const r=calcEval(v);res.textContent=r==null?'':isNaN(r)?'Finish the sum, for example 200+300':'= '+fmt(r);res.className='calcres small '+(isNaN(r)?'exp':'inc')};
  inp.addEventListener('input',show);
  bar.querySelectorAll('[data-op]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('touchstart',e=>{e.preventDefault();b.click()},{passive:false});
    b.addEventListener('click',()=>{const o=b.dataset.op;if(o==='='){const r=calcEval(inp.value);if(r!=null&&!isNaN(r)){inp.value=String(r);res.textContent=''}else show()}
      else{const st=inp.selectionStart??inp.value.length,en=inp.selectionEnd??inp.value.length;inp.setRangeText(o,st,en,'end');show()}inp.focus()})});
  const form=inp.closest('form');if(form)form.addEventListener('submit',e=>{const v=inp.value;if(!/[+\-*/×÷−()]/.test(v.replace(/^-/,'')))return;const r=calcEval(v);
    if(r==null||isNaN(r)){e.preventDefault();e.stopImmediatePropagation();show();inp.focus();return}inp.value=String(r)},true)})}

  if(h.tab!==UI.tab){Nav.stack=[];$('#sheetRoot').innerHTML='';UI.tab=h.tab;try{sessionStorage.setItem('ah-tab',h.tab)}catch(e){}render();window.scrollTo(0,0);if(h.d)location.replace('#'+h.tab);return}
  if(h.d>Nav.stack.length){location.replace('#'+hashFor(Nav.stack.length));return}

    <label class="field"><span>Note</span><input class="inp" id="t-note" maxlength="80" value="${esc(t.note||'')}" placeholder="Optional"></label>

/* ---------- loans: money you lent (to get back) and money you borrowed (to pay back) ---------- */
const LOANC={lent:'#C98A12',borrowed:'#8A4FBF'};
function loans(){return S.money.loans||(S.money.loans=[])}
function loanById(id){return loans().find(l=>l.id===id)}
function loanTx(id){return allTx().filter(t=>t.type==='ln'&&t.loan===id).sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0))}
function isPrincipal(t,l){return (l.dir==='lent')===(t.mv==='out')}
function loanStat(l){let given=0,back=0;loanTx(l.id).forEach(t=>{if(isPrincipal(t,l))given+=t.amt;else back+=t.amt});return{given,back,left:Math.round((given-back)*100)/100}}
function lnLabel(t,l){const n=l.name;return l.dir==='lent'?(t.mv==='out'?'Lent to '+n:'Received from '+n):(t.mv==='in'?'Borrowed from '+n:'Paid back to '+n)}
function loanAccs(l){return [...new Set(loanTx(l.id).filter(t=>isPrincipal(t,l)).map(t=>acc(t.acc).name))].join(', ')}
function loanHome(l){return (loanTx(l.id).find(t=>isPrincipal(t,l))||{}).acc}
function accPick(id,sel,label){const bal=balances();return `<div class="field"><span>${label}</span><div class="chips" id="${id}-g">${S.money.accounts.map(a=>`<button type="button" class="chip ${a.id===sel?'on':''}" data-v="${a.id}">${esc(a.name)} <span class="num" style="opacity:.7;font-weight:500">${fmt(bal[a.id]||0)}</span></button>`).join('')}</div><input type="hidden" id="${id}" value="${sel||''}"></div>`}
function bindPick(sh,id,onChange){sh.querySelectorAll('#'+id+'-g .chip').forEach(b=>b.onclick=()=>{sh.querySelector('#'+id).value=b.dataset.v;sh.querySelectorAll('#'+id+'-g .chip').forEach(x=>x.classList.toggle('on',x===b));onChange&&onChange(b.dataset.v)})}
function fmtDate(k){const d=pkey(k);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function vLoans(){const L=loans();const st=L.map(l=>({l,...loanStat(l)}));
  const get=st.filter(x=>x.l.dir==='lent').reduce((a,x)=>a+Math.max(0,x.left),0),owe=st.filter(x=>x.l.dir==='borrowed').reduce((a,x)=>a+Math.max(0,x.left),0);
  const f=UI.lf||'all',k=dkey(today());
  const shown=st.filter(x=>f==='all'||x.l.dir===f);
  const open=shown.filter(x=>x.left>0).sort((a,b)=>(a.l.due||'9999').localeCompare(b.l.due||'9999')),done=shown.filter(x=>x.left<=0);
  const card=x=>{const l=x.l,r=x.given?Math.min(1,x.back/x.given):0,late=x.left>0&&l.due&&l.due<k;
    return `<button class="card" data-act="loanDetail" data-id="${l.id}" style="text-align:left;width:100%;display:flex;flex-direction:column;gap:8px">
     <div class="row"><span class="badge" style="background:${LOANC[l.dir]}">${esc((l.name||'?')[0].toUpperCase())}</span><span class="grow" style="min-width:0"><b style="overflow-wrap:anywhere">${esc(l.name)}</b><div class="small muted">${l.dir==='lent'?'You lent':'You borrowed'} ${fmt(x.given)}${loanAccs(l)?` · ${l.dir==='lent'?'from':'into'} ${esc(loanAccs(l))}`:''}</div></span>
      <span style="text-align:right">${x.left>0?`<div class="num ${l.dir==='lent'?'inc':'exp'}" style="font-weight:700">${fmt(x.left)}</div><div class="small muted">${l.dir==='lent'?'to get back':'to pay back'}</div>`:'<span class="pill up">Settled</span>'}</span></div>
     ${x.given?`<div class="bar"><i style="width:${r*100}%;background:${LOANC[l.dir]}"></i></div>`:''}
     <div class="small ${late?'exp':'muted'}">${x.back?`${fmt(x.back)} ${l.dir==='lent'?'received back':'paid back'}`:'Nothing repaid yet'}${l.due&&x.left>0?` · ${late?'was due':'due'} ${fmtDate(l.due)}`:''}</div></button>`};
  return `<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="v num inc" style="font-size:19px">${fmt(get)}</div><div class="k">You will get back</div></div><div class="kpi"><div class="v num exp" style="font-size:19px">${fmt(owe)}</div><div class="k">You owe</div></div></div>
   <div class="chips">${[['all','All'],['lent','I lent'],['borrowed','I borrowed']].map(([v,t])=>`<button class="chip ${f===v?'on':''}" data-act="lf" data-v="${v}">${t}</button>`).join('')}</div>
   ${!L.length?`<div class="card empty"><div class="lbl">Loans</div><h3>Keep track of loans</h3><p class="small muted" style="margin:0 auto 14px;max-width:34ch">Record money you gave to someone or took from someone, with their name and dates. Add each repayment and see how much is left.</p><div class="acts"><button class="btn" data-act="loanNew" data-dir="lent">I lent money</button><button class="btn ghost" data-act="loanNew" data-dir="borrowed">I borrowed money</button></div></div>`
    :`${open.length?`<div class="gh"><span>Open</span><span class="num">${open.length}</span></div>${open.map(card).join('')}`:`<div class="card empty"><h3>Nothing open</h3><p class="small muted">All ${f==='all'?'':f==='lent'?'money you lent ':'money you borrowed '}is settled.</p></div>`}
      ${done.length?`<details><summary class="gh" style="cursor:pointer;list-style:none"><span>Settled (${done.length})</span><span>Show</span></summary><div style="display:flex;flex-direction:column;gap:10px">${done.map(card).join('')}</div></details>`:''}`}
   <p class="note">Loans move money in and out of your accounts but are not counted as income or expense.</p>`}
function loanDetail(id){const l=loanById(id);if(!l)return;const x=loanStat(l),k=dkey(today()),late=x.left>0&&l.due&&l.due<k;
  const items=loanTx(l.id);let run=0;const after={};items.forEach(t=>{run+=isPrincipal(t,l)?t.amt:-t.amt;after[t.id]=run});
  openSheet(`<div class="row" style="margin-bottom:10px"><span class="badge" style="background:${LOANC[l.dir]}">${esc((l.name||'?')[0].toUpperCase())}</span><h3 class="grow" style="margin:0;overflow-wrap:anywhere">${esc(l.name)}</h3><button class="btn sm ghost" data-act="loanEdit" data-id="${l.id}">Edit</button></div>
   <div class="card" style="margin-bottom:12px"><div class="lbl">${x.left>0?(l.dir==='lent'?'Left to get back':'Left to pay back'):'Settled'}</div>
    <div class="num ${x.left>0?(l.dir==='lent'?'inc':'exp'):''}" style="font-family:var(--f-display);font-size:30px;font-weight:700">${fmt(Math.max(0,x.left))}</div>
    ${x.given?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(1,x.back/x.given)*100}%;background:${LOANC[l.dir]}"></i></div>`:''}
    <div class="small muted" style="margin-top:6px">${l.dir==='lent'?'You lent':'You borrowed'} ${fmt(x.given)}${loanAccs(l)?` ${l.dir==='lent'?'from':'into'} <b style="color:var(--fg)">${esc(loanAccs(l))}</b>`:''} · ${fmt(x.back)} ${l.dir==='lent'?'received back':'paid back'}</div>
    ${l.due?`<div class="small ${late?'exp':'muted'}">${late?'Was due':'Due'} ${fmtDate(l.due)}</div>`:''}
    ${l.phone?`<div class="small muted" style="user-select:all">Phone: ${esc(l.phone)}</div>`:''}
    ${l.note?`<div class="small muted" style="overflow-wrap:anywhere">${esc(l.note)}</div>`:''}
    <div class="acts" style="margin-top:12px">${x.left>0?`<button class="btn" data-act="loanPay" data-id="${l.id}" data-k="repay">${l.dir==='lent'?'Received payment':'Pay back'}</button>`:''}<button class="btn ghost" data-act="loanPay" data-id="${l.id}" data-k="more">${l.dir==='lent'?'Lend more':'Borrow more'}</button></div></div>
   <h2 style="font-family:var(--f-display);font-size:17px;margin:0 0 6px">History</h2>
   <div class="txlist">${items.slice().reverse().map(t=>{const p=isPrincipal(t,l);return `<button class="tx" data-act="editTx" data-id="${t.id}" data-ym="${ymOf(t.date)}"><span class="badge" style="background:${p?LOANC[l.dir]:'var(--good)'}">${p?'+':'✓'}</span><span class="grow" style="min-width:0"><div class="t">${fmtDate(t.date)}</div><div class="s">${p?(l.dir==='lent'?'Lent':'Borrowed'):(l.dir==='lent'?'Received back':'Paid back')} · ${esc(acc(t.acc).name)}${t.note?' · '+esc(t.note):''}</div></span><span style="text-align:right"><div class="a num">${fmt(t.amt)}</div><div class="s num" style="font-size:11.5px;color:var(--muted)">Left ${fmt(Math.max(0,after[t.id]))}</div></span></button>`}).join('')||'<p class="small muted" style="padding:10px 12px;margin:0">No records yet.</p>'}</div>
   <button class="btn ghost block" style="margin-top:14px" data-act="close">Close</button>`)}
function loanForm(id,dir){const l=id?loanById(id):null;const isNew=!l;let d=l?l.dir:(dir||'lent');

   <div class="two"><label class="field"><span>Due date (optional)</span><input class="inp" type="date" id="ln-due" value="${l?.due||''}"></label><label class="field"><span>Phone (optional)</span><input class="inp" id="ln-ph" type="tel" maxlength="20" value="${esc(l?.phone||'')}" placeholder="03xx xxxxxxx"></label></div>
   <label class="field"><span>Note</span><input class="inp" id="ln-note" maxlength="120" value="${esc(l?.note||'')}" placeholder="What it was for (optional)"></label>

     const o=l||{id:uid(),dir:d,created:Date.now()};o.name=name;o.due=sh.querySelector('#ln-due').value||'';o.phone=sh.querySelector('#ln-ph').value.trim();o.note=sh.querySelector('#ln-note').value.trim();

       loans().push(o);(S.tx[ymOf(date)]=S.tx[ymOf(date)]||[]).push(r);ids.push('tx-'+ymOf(date))}

   const del=sh.querySelector('#ln-del');if(del)del.onclick=()=>{const n=loanTx(l.id).length;confirmIn(sh,`Delete the loan with ${esc(l.name)}${n?` and its ${n} record${n>1?'s':''}`:''}? Your account balances will change back. This cannot be undone.`,'Delete',()=>{const ms=new Set();Object.keys(S.tx).forEach(m=>{const b=S.tx[m].length;S.tx[m]=S.tx[m].filter(t=>!(t.type==='ln'&&t.loan===l.id));if(S.tx[m].length!==b)ms.add('tx-'+m)});S.money.loans=loans().filter(x=>x.id!==l.id);closeSheet();save('money',...ms);toast('Loan deleted')})}})}
function loanPay(id,kind,t,ym){const l=loanById(id);if(!l)return;const isNew=!t;

  const st=loanStat(l);const left=st.left+(t&&!isPrincipal(t,l)?t.amt:0);

  const inAcc=(l.dir==='lent')===(kind==='repay');const home=loanHome(l);

   <label class="field"><span>Date</span><input class="inp" type="date" id="lp-d" value="${t?t.date:dkey(today())}" required></label>
   <label class="field"><span>Note</span><input class="inp" id="lp-note" maxlength="80" value="${esc(t?.note||'')}" placeholder="Optional"></label>

/* ---------- history: every record for a savings goal or an account, with running balance ---------- */
function histHtml(items,delta,{empty='No records yet.',start=0}={}){
  const asc=items.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0));let run=start;const bal={};asc.forEach(t=>{run+=delta(t);bal[t.id]=run});
  const desc=asc.reverse();if(!desc.length)return `<p class="small muted" style="margin:6px 2px">${empty}</p>`;
  let inn=0,out=0;desc.forEach(t=>{const d=delta(t);if(d>0)inn+=d;else out-=d});
  const groups={};desc.forEach(t=>{const k=ymOf(t.date);(groups[k]=groups[k]||[]).push(t)});
  return `<div class="kpis" style="margin-bottom:6px"><div class="kpi"><div class="v num inc" style="font-size:17px">${fmtK(inn)}</div><div class="k">Total in</div></div><div class="kpi"><div class="v num exp" style="font-size:17px">${fmtK(out)}</div><div class="k">Total out</div></div><div class="kpi"><div class="v num" style="font-size:17px">${desc.length}</div><div class="k">Records</div></div></div>`+
   Object.entries(groups).map(([ym,L])=>`<div class="day-h"><span>${ymLabel(ym)}</span><span class="num">${(()=>{const n=L.reduce((a,t)=>a+delta(t),0);return (n>0?'+':'')+fmt(n)})()}</span></div><div class="txlist">${L.map(t=>{const d=delta(t),dt=pkey(t.date);
     const c=t.type==='ln'?{name:txName(t),color:LOANC[(loanById(t.loan)||{}).dir]||'#6B5B4B'}:t.type==='tr'?{name:'Transfer',color:'#5B6964'}:(t.type==='sv'||t.type==='sw')?{name:txName(t),color:pot(t.pot).color}:cat(t.cat);
     const via=t.type==='tr'?(d>0?'From '+acc(t.acc).name:'To '+acc(t.to).name):t.type==='sv'?'From '+acc(t.acc).name:t.type==='sw'?'Into '+acc(t.acc).name:'';
     return `<button class="tx" data-act="editTx" data-id="${t.id}" data-ym="${ymOf(t.date)}"><span class="badge" style="background:${c.color}">${t.type==='tr'?'⇄':(t.type==='sv'||t.type==='sw')?'S':esc(c.name[0])}</span><span class="grow" style="min-width:0"><div class="t">${dt.getDate()} ${MON[dt.getMonth()]} ${dt.getFullYear()}</div><div class="s">${esc(t.type==='tr'||t.type==='sv'||t.type==='sw'?via:c.name)}${t.note?' · '+esc(t.note):''}</div></span><span style="text-align:right"><div class="a num ${d>0?'inc':'exp'}">${d>0?'+':'−'}${fmt(Math.abs(d)).replace('−','')}</div><div class="s num" style="font-size:11.5px;color:var(--muted)">Bal ${fmt(bal[t.id])}</div></span></button>`}).join('')}</div>`).join('')}
function potDetail(id){const p=(S.money.pots||[]).find(x=>x.id===id);if(!p)return;const b=potBal(p.id),r=p.target?b/p.target:0;const gen=p.id===genPot().id;
  openSheet(`<div class="row" style="margin-bottom:10px"><i class="dot" style="background:${p.color};width:14px;height:14px"></i><h3 class="grow" style="margin:0">${esc(p.name)}</h3><button class="btn sm ghost" data-act="editPot" data-id="${p.id}">Edit goal</button></div>
   <div class="card" style="margin-bottom:12px"><div class="lbl">Saved</div><div class="num ${b<0?'exp':''}" style="font-family:var(--f-display);font-size:30px;font-weight:700">${fmt(b)}</div>
    ${p.target?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(Math.max(r,0),1)*100}%;background:${r>=1?'var(--good)':p.color}"></i></div><div class="small muted" style="margin-top:4px">${pct(Math.max(r,0))} of ${fmt(p.target)}${p.date?' · by '+(d=>d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear())(pkey(p.date)):''}</div>`:''}
    ${gen&&(S.money.pots||[]).length>1?'<div class="small muted" style="margin-top:4px">Everything in your Savings account that is not set aside for another goal.</div>':''}
    <div class="acts" style="margin-top:12px"><button class="btn" data-act="saveIn" data-pot="${p.id}">Add</button><button class="btn ghost" data-act="saveOut" data-pot="${p.id}">Take out</button></div></div>
   <h2 style="font-family:var(--f-display);font-size:17px;margin:0 0 4px">History</h2>${histHtml(potItems(p.id),savDelta,{start:potStart(p.id),empty:'Nothing added yet. Tap Add to put money into this goal.'})}
   <button class="btn ghost block" style="margin-top:14px" data-act="close">Close</button>`)}

    ${isSav?`<div class="acts" style="margin-top:12px"><button class="btn" data-act="saveIn">Add to savings</button><button class="btn ghost" data-act="saveOut">Take out</button></div>`:''}</div>

function savingsForm(t,ym,dir,potId){ensureSav();const sid=savId();const isNew=!t;genPot();

  else{mode=dir==='out'?'out':'in';other=(S.money.accounts.find(a=>a.id!==sid)||{}).id;p=potId||genPot().id}
  const others=S.money.accounts.filter(a=>a.id!==sid);
  const potOpts=S.money.pots.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.name)} (${fmt(potBal(x.id))})</option>`).join('');

   ${S.money.pots.length>1?`<label class="field"><span>Savings goal</span><select class="inp" id="s-pot">${potOpts}</select></label>`:''}
   <div class="two"><label class="field"><span id="s-acc-l">From account</span><select class="inp" id="s-acc">${others.map(a=>`<option value="${a.id}" ${a.id===other?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label class="field"><span>Date</span><input class="inp" type="date" id="s-date" value="${t?t.date:dkey(today())}" required></label></div>
   <label class="field"><span>Note</span><input class="inp" id="s-note" maxlength="80" value="${esc(t?.note||'')}" placeholder="Optional"></label>
   <p class="small exp" id="s-err" hidden></p>
   <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">Save</button></div>
   ${isNew?'':`<button type="button" class="link" id="s-del" style="color:var(--bad)">Delete this record</button>`}<div class="confirm"></div></form>`,sh=>{
   const draw=()=>{sh.querySelectorAll('#s-type button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));sh.querySelector('#s-acc-l').textContent=mode==='in'?'From account':'Into account'};draw();
   sh.querySelectorAll('#s-type button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;draw()});if(isNew)setTimeout(()=>sh.querySelector('#s-amt').focus(),60);
   sh.querySelector('#sf').onsubmit=e=>{e.preventDefault();const err=sh.querySelector('#s-err');const amt=parseFloat(sh.querySelector('#s-amt').value);
     if(!(amt>0)){err.hidden=false;err.textContent='Enter an amount greater than zero.';return}
     const ax=sh.querySelector('#s-acc').value;if(!ax){err.hidden=false;err.textContent='Add another account first, such as Cash or Bank.';return}
     const pp=sh.querySelector('#s-pot')?sh.querySelector('#s-pot').value:genPot().id;
     const o={id:t?.id||uid(),type:'tr',amt:Math.round(amt*100)/100,acc:mode==='in'?ax:sid,to:mode==='in'?sid:ax,date:sh.querySelector('#s-date').value||dkey(today()),note:sh.querySelector('#s-note').value.trim(),t:t?.t||Date.now()};
     if(pp!==genPot().id)o.pot=pp;
     const ids=[];if(!isNew){S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);ids.push('tx-'+ym)}
     const nym=ymOf(o.date);(S.tx[nym]=S.tx[nym]||[]).push(o);ids.push('tx-'+nym);UI.ym=nym;closeSheet();save(...new Set(ids));toast(mode==='in'?fmt(o.amt)+' added to savings':fmt(o.amt)+' taken out of savings')};
   const del=sh.querySelector('#s-del');if(del)del.onclick=()=>confirmIn(sh,'Delete this savings record?','Delete',()=>{S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);closeSheet();save('tx-'+ym);toast('Record deleted')})})}

function reorderCats(){
  const row=(c,i,L)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><i class="dot" style="background:${c.color}"></i><span class="grow">${esc(c.name)}</span>
    <button type="button" class="mini" data-mv="${c.id}" data-n="top" aria-label="Move ${esc(c.name)} to top" ${i===0?'disabled style="opacity:.3"':''}>⤒</button>
    <button type="button" class="mini" data-mv="${c.id}" data-n="-1" aria-label="Move ${esc(c.name)} up" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
    <button type="button" class="mini" data-mv="${c.id}" data-n="1" aria-label="Move ${esc(c.name)} down" ${i===L-1?'disabled style="opacity:.3"':''}>↓</button></div>`;
  const draw=sh=>{const ex=S.money.cats.filter(c=>c.type==='exp'),inc=S.money.cats.filter(c=>c.type==='inc');
    sh.querySelector('#ro').innerHTML=`<div class="lbl">Expense</div><div>${ex.map((c,i)=>row(c,i,ex.length)).join('')}</div><div class="lbl" style="margin-top:14px">Income</div><div>${inc.map((c,i)=>row(c,i,inc.length)).join('')}</div>`;
    sh.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const c=S.money.cats.find(x=>x.id===b.dataset.mv);const same=S.money.cats.filter(x=>x.type===c.type);let k=same.indexOf(c);
      const others=S.money.cats.filter(x=>x.type!==c.type);same.splice(k,1);
      if(b.dataset.n==='top')k=0;else k=Math.max(0,Math.min(same.length,k+(+b.dataset.n)));same.splice(k,0,c);
      S.money.cats=c.type==='exp'?[...same,...others]:[...others,...same];Store.mark('money');draw(sh)})};
  openSheet(`<h3>Reorder categories</h3><p class="small muted" style="margin:-8px 0 12px">⤒ moves a category to the top. The order here is the order you see when adding a record.</p><div id="ro"></div><button class="btn block" style="margin-top:16px" id="ro-done">Done</button>`,sh=>{draw(sh);sh.querySelector('#ro-done').onclick=navBack})}
function catForm(id,type){const c=S.money.cats.find(x=>x.id===id);const isNew=!c;let ic=c&&c.icon||'';const used=c&&allTx().some(t=>t.cat===c.id);let col=c?c.color:COLORS[S.money.cats.length%COLORS.length];
  openSheet(`<h3>${isNew?'New category':'Edit category'}</h3><form class="form" id="cf"><label class="field"><span>Name</span><input class="inp" id="c-n" required maxlength="30" value="${esc(c?.name||'')}"></label>
   <div class="field"><span>Icon</span><div class="swatches" id="c-ic"><button type="button" class="icb ${!ic?'on':''}" data-v="" aria-label="Automatic icon" style="font-size:13px">Auto</button>${CAT_ICONS.map(x=>`<button type="button" class="icb ${x===ic?'on':''}" data-v="${x}">${x}</button>`).join('')}</div></div>
   <div class="field"><span>Colour</span><div class="swatches" id="c-col">${COLORS.map(x=>`<button type="button" class="sw ${x===col?'on':''}" data-v="${x}" style="background:${x}" aria-label="Colour"></button>`).join('')}</div></div>
   <div class="acts"><button type="button" class="btn ghost" id="c-back">Back</button><button class="btn" type="submit">Save</button></div>
   ${isNew?'':`<button type="button" class="link" id="c-del" style="color:var(--bad)">Delete category</button>`}<div class="confirm"></div></form>`,sh=>{
   sh.querySelectorAll('#c-col button').forEach(b=>b.onclick=()=>{col=b.dataset.v;sh.querySelectorAll('#c-col button').forEach(x=>x.classList.toggle('on',x===b))});
   sh.querySelectorAll('#c-ic button').forEach(b=>b.onclick=()=>{ic=b.dataset.v;sh.querySelectorAll('#c-ic button').forEach(x=>x.classList.toggle('on',x===b))});
   sh.querySelector('#c-back').onclick=navBack;
   sh.querySelector('#cf').onsubmit=e=>{e.preventDefault();const n=sh.querySelector('#c-n').value.trim();if(!n)return;const o=c||{id:uid(),type:type||'exp'};o.name=n;o.color=col;if(ic)o.icon=ic;else delete o.icon;if(isNew)S.money.cats.push(o);Store.mark('money');toast('Category saved');navBack()};
   const del=sh.querySelector('#c-del');if(del)del.onclick=()=>used?confirmIn(sh,'This category has records, so it cannot be deleted. Rename it instead, or change those records first.','OK',()=>sh.querySelector('.confirm').innerHTML=''):confirmIn(sh,'Delete this category?','Delete',()=>{S.money.cats=S.money.cats.filter(x=>x.id!==c.id);delete S.money.budgets[c.id];Store.mark('money');toast('Category deleted');navBack()})})}

/* ---------- sample data ---------- */
function loadSample(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const T=today();
  const hs=[{name:'Pray Fajr on time',color:COLORS[0],p0:.55,p1:.9},{name:'Read Quran',color:COLORS[1],p0:.4,p1:.75},{name:'Exercise',color:COLORS[2],p0:.6,p1:.35,den:7,num:4},{name:'Study',color:COLORS[4],type:'num',target:2,unit:'hours',p0:.5,p1:.8}];
  hs.forEach(o=>{const h={id:uid(),name:o.name,color:o.color,type:o.type||'bool',num:o.num||1,den:o.den||1,target:o.target||1,unit:o.unit||'',created:dkey(addDays(T,-80)),sample:true};
    const c={};for(let i=80;i>=1;i--){const p=o.p0+(o.p1-o.p0)*(1-i/80);if(rnd()<p)c[dkey(addDays(T,-i))]=h.type==='num'?Math.round((1+rnd()*2)*2)/2:1}
    S.habits.list.push(h);S.habits.checks[h.id]=c});
  const ex=[['e0',[250,900]],['e1',[1500,4500]],['e2',[150,600]],['e3',[3000,9000]],['e4',[500,1500]],['e6',[1000,6000]],['e7',[500,3000]],['e10',[200,1000]]];
  for(let mo=2;mo>=0;mo--){const base=new Date(T.getFullYear(),T.getMonth()-mo,1);const dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();const lastDay=mo===0?T.getDate():dim;
    const add=(day,o)=>{const d=new Date(base.getFullYear(),base.getMonth(),day);const k=dkey(d);(S.tx[k.slice(0,7)]=S.tx[k.slice(0,7)]||[]).push({id:uid(),date:k,t:Date.now(),sample:true,...o})};
    add(1,{type:'inc',amt:85000,cat:'i0',acc:'bank',note:'Monthly salary'});add(1,{type:'exp',amt:25000,cat:'e5',acc:'bank',note:'House rent'});
    add(2,{type:'tr',amt:30000,acc:'bank',to:'cash',note:'ATM'});
    for(let d=1;d<=lastDay;d++){const n=rnd()<.35?2:rnd()<.7?1:0;for(let j=0;j<n;j++){const[c,[lo,hi]]=ex[Math.floor(rnd()*ex.length)];add(d,{type:'exp',amt:Math.round((lo+rnd()*(hi-lo))/10)*10,cat:c,acc:rnd()<.65?'cash':'wallet',note:''})}}
    ensureSav();add(1,{type:'tr',amt:10000,acc:'bank',to:'sav',note:'From salary'});
    add(Math.min(3,lastDay),{type:'tr',amt:15000,acc:'bank',to:'wallet',note:'Top up'})}
  if(!Object.keys(S.money.budgets).length)S.money.budgets={e0:12000,e1:15000,e2:6000,e6:8000};
  save('habits','money',...Object.keys(S.tx).map(m=>'tx-'+m));toast('Sample data loaded')}
function clearSample(){const ids=S.habits.list.filter(h=>h.sample).map(h=>h.id);S.habits.list=S.habits.list.filter(h=>!h.sample);ids.forEach(i=>delete S.habits.checks[i]);
  const ms=Object.keys(S.tx);ms.forEach(m=>{S.tx[m]=S.tx[m].filter(t=>!t.sample)});save('habits',...ms.map(m=>'tx-'+m));toast('Sample data removed')}

/* ---------- periods: day / week / month / year ---------- */
const PER=[['day','Day'],['week','Week'],['month','Month'],['year','Year']];
function perRange(per,a){const d=pkey(a);let s,e,label;
  if(per==='day'){s=e=a;label=WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
  else if(per==='week'){const st=addDays(d,-((d.getDay()+6)%7)),en=addDays(st,6);s=dkey(st);e=dkey(en);label=st.getDate()+(st.getMonth()!==en.getMonth()?' '+MON[st.getMonth()]:'')+' – '+en.getDate()+' '+MON[en.getMonth()]+' '+en.getFullYear()}
  else if(per==='year'){s=d.getFullYear()+'-01-01';e=d.getFullYear()+'-12-31';label=String(d.getFullYear())}
  else{s=a.slice(0,7)+'-01';e=dkey(new Date(d.getFullYear(),d.getMonth()+1,0));label=MON[d.getMonth()]+' '+d.getFullYear()}
  return{s,e,label}}
function perShift(per,a,n){const d=pkey(a);if(per==='day')return dkey(addDays(d,n));if(per==='week')return dkey(addDays(d,7*n));if(per==='year')return dkey(new Date(d.getFullYear()+n,0,1));return dkey(new Date(d.getFullYear(),d.getMonth()+n,1))}
function txRange(s,e){const out=[];const ms=s.slice(0,7),me=e.slice(0,7);Object.keys(S.tx).forEach(m=>{if(m<ms||m>me)return;S.tx[m].forEach(t=>{if(t.date>=s&&t.date<=e)out.push(t)})});return out.sort((a,b)=>b.date.localeCompare(a.date)||(b.t||0)-(a.t||0))}
function sumRange(L){let i=0,e=0;L.forEach(t=>{if(t.type==='inc')i+=t.amt;else if(t.type==='exp')e+=t.amt});return{i,e,b:i-e}}
function inCurRange(k){const r=perRange(UI.per||'month',UI.pa||dkey(today()));return k>=r.s&&k<=r.e}
function perBar(per,act,label){return `<div class="chips" style="margin-bottom:10px">${PER.map(([v,l])=>`<button class="chip ${per===v?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`}

/* ---------- recurring records ---------- */
function addFreq(k,f,day){const d=pkey(k);if(f==='daily')return dkey(addDays(d,1));if(f==='weekly')return dkey(addDays(d,7));
  if(f==='yearly')return dkey(new Date(d.getFullYear()+1,d.getMonth(),Math.min(day||d.getDate(),new Date(d.getFullYear()+1,d.getMonth()+1,0).getDate())));
  const y=d.getFullYear(),m=d.getMonth()+1;const last=new Date(y,m+1,0).getDate();return dkey(new Date(y,m,Math.min(day||d.getDate(),last)))}
const FREQ={none:'Does not repeat',daily:'Every day',weekly:'Every week',monthly:'Every month',yearly:'Every year'};
function recurs(){return S.money.recur||(S.money.recur=[])}
function applyRecurring(){const k=dkey(today());if(UI.recDay===k)return;UI.recDay=k;const ch=new Set();let n=0;
  recurs().forEach(r=>{if(!r.on)return;let guard=0;while(r.next&&r.next<=k&&guard++<400){if(r.end&&r.next>r.end){r.on=false;break}
    const t={...r.tpl,id:uid(),date:r.next,t:Date.now()+n++,rec:r.id};const m=ymOf(t.date);(S.tx[m]=S.tx[m]||[]).push(t);ch.add('tx-'+m);r.next=addFreq(r.next,r.freq,r.day)}});
  if(ch.size){ch.add('money');ch.forEach(id=>Store.mark(id));toast(n===1?'1 repeating record added':n+' repeating records added')}}
function recurCard(){const R=recurs();if(!R.length)return '';
  return `<div class="card"><h2>Repeating records</h2><div class="txlist">${R.map(r=>{const c=r.tpl.type==='tr'?{name:'Transfer',color:'#5B6964'}:cat(r.tpl.cat);
    return `<button class="tx" data-act="recurEdit" data-id="${r.id}"><span class="badge" style="background:${c.color}">${r.tpl.type==='tr'?'⇄':catGlyph(c)}</span><span class="grow" style="min-width:0"><div class="t">${esc(c.name)}${r.tpl.note?' · '+esc(r.tpl.note):''}</div><div class="s">${FREQ[r.freq]} · ${r.on?'next '+fmtDate(r.next):'paused'}</div></span><span class="a num ${r.tpl.type==='inc'?'inc':r.tpl.type==='exp'?'exp':''}">${fmt(r.tpl.amt)}</span></button>`}).join('')}</div>
   <p class="small muted" style="margin:8px 0 0">These are added on their dates automatically when you open the app.</p></div>`}
function recurForm(id){const r=recurs().find(x=>x.id===id);if(!r)return;
  openSheet(`<h3>Repeating record</h3><form class="form" id="rf">
   <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">Save</button></div>
   <div class="small muted">${esc(r.tpl.type==='tr'?'Transfer':cat(r.tpl.cat).name)} · ${esc(acc(r.tpl.acc).name)}</div>
   <label class="field"><span>Amount</span><input class="inp amount num" id="r-a" type="number" min="0" step="any" inputmode="decimal" value="${r.tpl.amt}"></label>
   <div class="two"><label class="field"><span>Repeats</span><select class="inp" id="r-f">${['daily','weekly','monthly','yearly'].map(f=>`<option value="${f}" ${r.freq===f?'selected':''}>${FREQ[f]}</option>`).join('')}</select></label>
   <label class="field"><span>Next date</span><input class="inp" type="date" id="r-n" value="${r.next}"></label></div>
   <label class="field"><span>Stop after (optional)</span><input class="inp" type="date" id="r-e" value="${r.end||''}"></label>
   <label class="row"><input type="checkbox" id="r-on" ${r.on?'checked':''} style="width:20px;height:20px"><span>Keep repeating</span></label>
   <button type="button" class="link" id="r-del" style="color:var(--bad)">Delete this repeat</button><div class="confirm"></div>
   <p class="small muted">Records already added stay in your history.</p></form>`,sh=>{
   sh.querySelector('#rf').onsubmit=e=>{e.preventDefault();const a=parseFloat(sh.querySelector('#r-a').value);if(a>0)r.tpl.amt=Math.round(a*100)/100;r.freq=sh.querySelector('#r-f').value;r.next=sh.querySelector('#r-n').value||r.next;r.day=pkey(r.next).getDate();r.end=sh.querySelector('#r-e').value||'';r.on=sh.querySelector('#r-on').checked;UI.recDay=null;closeSheet();save('money');toast('Saved')};
   sh.querySelector('#r-del').onclick=()=>confirmIn(sh,'Stop and delete this repeat? Records already added stay.','Delete',()=>{S.money.recur=recurs().filter(x=>x.id!==r.id);closeSheet();save('money');toast('Repeat deleted')})})}

/* ---------- Reports: periods, income/expense, cash flow, accounts ---------- */
function flowChart(vals,labels){const W=340,h=160,P={l:40,r:8,t:10,b:22},iw=W-P.l-P.r,ih=h-P.t-P.b,n=vals.length;
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi===lo)hi=lo+1;const sp=hi-lo;hi+=sp*.08;lo-=lo<0?sp*.08:0;
  const x=i=>P.l+(n<=1?iw/2:i*iw/(n-1)),y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;let g='';

function vReports(){const per=UI.rper||'month',pa=UI.rpa||dkey(today());const r=perRange(per,pa);const kind=UI.rkind||'exp';

  const daysGone=Math.max(1,Math.min(Math.round((Math.min(+today(),+pkey(r.e))-+pkey(r.s))/864e5)+1,999));
  const spark=per==='year'?[...Array(12)].map((_,m)=>{let v=0;(S.tx[r.s.slice(0,4)+'-'+pad(m+1)]||[]).forEach(t=>{if(t.type===kind)v+=t.amt});return v}):null;
  const daily=per==='month'?(()=>{const dim=+r.e.slice(8);const a=Array(dim).fill(0);L.forEach(t=>{if(t.type===kind)a[+t.date.slice(8)-1]+=t.amt});return a})():null;
  const months=[...Array(6)].map((_,i)=>shiftYm(ymOf(pa),i-5));const mi=months.map(x=>monthSum(x).i),me=months.map(x=>monthSum(x).e);
