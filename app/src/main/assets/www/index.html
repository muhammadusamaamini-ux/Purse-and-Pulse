function taskSub(){const k=dkey(today());const o=openTasks();const due=o.filter(t=>t.due&&t.due<=k).length;return o.length?`${o.length} open${due?' · '+due+' due today or late':''}`:'Nothing open'}
function dueLabel(k){if(!k)return '';const d=pkey(k),t=today();const n=Math.round((d-t)/864e5);
  if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';if(n>1&&n<7)return WD[d.getDay()];return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'')}
function filtTasks(){return S.tasks.items.filter(t=>UI.tlist==='all'||t.list===UI.tlist)}
function sortT(a,b){return (a.due||'9999').localeCompare(b.due||'9999')||PRI[a.pri||'normal'][2]-PRI[b.pri||'normal'][2]||(a.created||0)-(b.created||0)}
function taskMeta(t){const k=dkey(today());const od=t.status!=='done'&&t.due&&t.due<k;const p=PRI[t.pri||'normal'];const ck=t.checks||[];
  return `<div class="meta">${t.due?`<span class="${od?'od':''}">${od?'Late · ':''}${dueLabel(t.due)}</span>`:''}${t.pri&&t.pri!=='normal'?`<span class="flag" style="color:${p[1]}">${FLAG(p[1])}${p[0]}</span>`:''}${t.status==='doing'?'<span class="pill" style="background:var(--accent-soft);color:var(--accent);padding:1px 7px">In progress</span>':''}${ck.length?`<span>☑ ${ck.filter(c=>c.d).length}/${ck.length}</span>`:''}${UI.tlist==='all'?`<span class="row" style="gap:4px"><i class="dot" style="background:${tlist(t.list).color};width:7px;height:7px"></i>${esc(tlist(t.list).name)}</span>`:''}</div>`}
function taskRow(t){return `<div class="tk ${t.status==='done'?'isdone':''}"><button class="chk ${t.status==='done'?'done':''}" data-act="tdone" data-id="${t.id}" aria-label="Mark done">${t.status==='done'?ICON.check:''}</button><button class="body" data-act="topen" data-id="${t.id}"><div class="tt">${esc(t.title)}</div>${taskMeta(t)}</button></div>`}
function listChips(){return `<div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none"><button class="chip ${UI.tlist==='all'?'on':''}" data-act="tl" data-v="all" style="flex:none">All lists</button>${S.tasks.lists.map(l=>`<button class="chip ${UI.tlist===l.id?'on':''}" data-act="tl" data-v="${l.id}" style="flex:none;${UI.tlist===l.id?`background:${l.color};border-color:${l.color};color:#fff`:''}">${esc(l.name)}</button>`).join('')}<button class="chip" data-act="listForm" style="flex:none">+ List</button></div>`}
function quickAdd(){return `<form class="quick" id="qa"><input class="inp" id="qa-t" maxlength="140" placeholder="Add a task for ${UI.tlist==='all'?'today':esc(tlist(UI.tlist).name)}…" autocomplete="off"><button class="btn" type="submit">Add</button></form>`}
function vTaskList(){const k=dkey(today()),tm=dkey(addDays(today(),1)),wk=dkey(addDays(today(),7));
  const all=filtTasks().sort(sortT);const open=all.filter(t=>t.status!=='done');const done=all.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const G=[['Late',t=>t.due&&t.due<k,'var(--bad)'],['Today',t=>t.due===k],['Tomorrow',t=>t.due===tm],['Next 7 days',t=>t.due>tm&&t.due<=wk],['Later',t=>t.due>wk],['No date',t=>!t.due]];
  const used=new Set();const groups=G.map(([n,f,c])=>{const L=open.filter(t=>!used.has(t.id)&&f(t));L.forEach(t=>used.add(t.id));return{n,L,c}}).filter(g=>g.L.length);
  if(!S.tasks.items.length)return `${listChips()}${quickAdd()}<div class="card empty"><div class="lbl">Tasks</div><h3>Plan your day here</h3><p class="small muted" style="margin:0 auto 14px;max-width:34ch">Type a task above and tap Add. Tap a task to give it a due date, priority, list and checklist. Board and Calendar show the same tasks in other ways.</p><button class="btn ghost" data-act="sampleTasks">Try sample tasks</button></div>`;
  return `${sampleTaskBanner()}${listChips()}${quickAdd()}
   ${groups.length?groups.map(g=>`<div><div class="gh"><span style="${g.c?`color:${g.c}`:''}">${g.n}</span><span class="num">${g.L.length}</span></div><div class="grp">${g.L.map(taskRow).join('')}</div></div>`).join(''):`<div class="card empty"><h3>All done</h3><p class="small muted">No open tasks${UI.tlist==='all'?'':' in this list'}.</p></div>`}
   ${done.length?`<div><button class="link" data-act="toggleDone">${UI.showDone?'Hide':'Show'} completed (${done.length})</button>${UI.showDone?`<div class="grp" style="margin-top:6px">${done.slice(0,50).map(taskRow).join('')}</div>`:''}</div>`:''}
   <p class="note" id="syncNote">${syncText()}</p>`}
function vBoard(){const all=filtTasks();
  return `${sampleTaskBanner()}${listChips()}<div class="board">${STATUS.map(([st,lab],i)=>{const L=all.filter(t=>(t.status||'todo')===st).sort(st==='done'?(a,b)=>(b.doneAt||0)-(a.doneAt||0):sortT);
    return `<div class="col"><h4><span>${lab}</span><span class="pill flat num">${L.length}</span></h4>${L.slice(0,st==='done'?20:200).map(t=>`<div class="bcard"><button class="body" data-act="topen" data-id="${t.id}" style="background:none;border:0;padding:0;text-align:left;width:100%"><div class="tt" style="${st==='done'?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div>${taskMeta(t)}</button><div class="bmove">${i>0?`<button data-act="tmove" data-id="${t.id}" data-n="-1">‹ ${STATUS[i-1][1]}</button>`:'<span></span>'}${i<2?`<button data-act="tmove" data-id="${t.id}" data-n="1">${STATUS[i+1][1]} ›</button>`:''}</div></div>`).join('')||'<p class="small muted" style="margin:4px 2px">No tasks</p>'}${st==='todo'?'<button class="btn sm ghost" data-act="tnew" style="background:var(--surface)">+ Add task</button>':''}</div>`}).join('')}</div><p class="note">Swipe sideways to see each column. Use the buttons on a card to move it.</p>`}
function vCal(){const ym=UI.cym;const[y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1);const start=addDays(first,-first.getDay());const k=dkey(today());
  const by={};filtTasks().forEach(t=>{if(t.due)(by[t.due]=by[t.due]||[]).push(t)});
  let cells=WD.map(w=>`<div class="wd">${w[0]}</div>`).join('');
  for(let i=0;i<42;i++){const d=addDays(start,i);const dk=dkey(d);if(i>=35&&d.getMonth()!==m-1)break;const L=by[dk]||[];
    cells+=`<button data-act="csel" data-v="${dk}" class="${d.getMonth()!==m-1?'out':''} ${dk===k?'today':''} ${dk===UI.csel?'sel':''}"><span class="num">${d.getDate()}</span><span class="dots">${L.slice(0,4).map(t=>`<i style="background:${t.status==='done'?'var(--muted)':dk===UI.csel?'currentColor':tlist(t.list).color}"></i>`).join('')}</span></button>`}
  const sel=(by[UI.csel]||[]).sort(sortT);const sd=pkey(UI.csel);
  return `${listChips()}<div class="card"><div class="month" style="margin-bottom:10px"><button class="iconbtn" data-act="cym" data-n="-1" aria-label="Previous month">${ICON.left}</button><b>${ymLabel(ym)}</b><button class="iconbtn" data-act="cym" data-n="1" aria-label="Next month">${ICON.right}</button></div><div class="cal">${cells}</div></div>
   <div><div class="gh"><span>${WD[sd.getDay()]}, ${sd.getDate()} ${MON[sd.getMonth()]}</span><button class="link" data-act="tnew" data-due="${UI.csel}" style="text-transform:none;letter-spacing:0">+ Add on this day</button></div>${sel.length?`<div class="grp">${sel.map(taskRow).join('')}</div>`:'<p class="small muted" style="margin:4px 2px">No tasks due this day.</p>'}</div>`}
function sampleTaskBanner(){return S.tasks.items.some(t=>t.sample)?`<div class="card row" style="background:var(--warm-soft);border-color:transparent"><span class="grow small" style="min-width:0"><b style="color:var(--warm)">Sample tasks.</b> Examples to show the views.</span><button class="btn sm ghost" data-act="clearSampleTasks">Remove</button></div>`:''}
function taskForm(id,preset={}){const ex=S.tasks.items.find(x=>x.id===id);const isNew=!ex;
  const t=ex?JSON.parse(JSON.stringify(ex)):{title:'',desc:'',status:'todo',pri:'normal',due:preset.due||'',list:UI.tlist!=='all'?UI.tlist:(S.tasks.lists[0]?.id||''),checks:[]};
  openSheet(`<h3>${isNew?'New task':'Task'}</h3><form class="form" id="tkf">
   <label class="field"><span>Title</span><input class="inp" id="k-t" required maxlength="140" value="${esc(t.title)}" placeholder="What needs doing?"></label>
   <div class="field"><span>Status</span><div class="seg" id="k-st">${STATUS.map(([v,l])=>`<button type="button" data-v="${v}" class="${t.status===v?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="field"><span>Priority</span><div class="seg" id="k-p">${Object.entries(PRI).map(([v,[l,c]])=>`<button type="button" data-v="${v}" class="${t.pri===v?'on':''}"><span class="flag" style="color:${c}">${FLAG(c)}</span> ${l}</button>`).join('')}</div></div>
   <div class="two"><label class="field"><span>Due date</span><input class="inp" type="date" id="k-d" value="${t.due||''}"></label><label class="field"><span>List</span><select class="inp" id="k-l">${S.tasks.lists.map(l=>`<option value="${l.id}" ${l.id===t.list?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label></div>
   <div class="chips" style="margin-top:-6px"><button type="button" class="chip" data-due="0">Today</button><button type="button" class="chip" data-due="1">Tomorrow</button><button type="button" class="chip" data-due="7">Next week</button><button type="button" class="chip" data-due="">No date</button></div>
   <label class="field"><span>Description</span><textarea class="inp" id="k-desc" rows="3" maxlength="2000" placeholder="Notes, links, details">${esc(t.desc||'')}</textarea></label>
   <div class="field"><span>Checklist</span><div class="cklist" id="k-ck"></div><div class="quick" style="margin-top:4px"><input class="inp" id="k-cki" maxlength="120" placeholder="Add an item"><button type="button" class="btn sm ghost" id="k-cka">Add</button></div></div>
   <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">${isNew?'Add task':'Save'}</button></div>
   ${isNew?'':`<button type="button" class="link" id="k-del" style="color:var(--bad)">Delete task</button>`}<div class="confirm"></div></form>`,sh=>{
   const seg=(sel,key)=>sh.querySelectorAll(sel+' button').forEach(b=>b.onclick=()=>{t[key]=b.dataset.v;sh.querySelectorAll(sel+' button').forEach(x=>x.classList.toggle('on',x===b))});seg('#k-st','status');seg('#k-p','pri');
   sh.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{sh.querySelector('#k-d').value=b.dataset.due===''?'':dkey(addDays(today(),+b.dataset.due))});
   const drawCk=()=>{sh.querySelector('#k-ck').innerHTML=t.checks.map((c,i)=>`<div class="ckrow ${c.d?'d':''}"><input type="checkbox" id="ck${i}" data-i="${i}" ${c.d?'checked':''}><label class="txt" for="ck${i}">${esc(c.t)}</label><button type="button" class="link" data-rm="${i}" style="color:var(--muted)" aria-label="Remove item">${ICON.x.replace('<svg','<svg width="16" height="16"')}</button></div>`).join('');
     sh.querySelectorAll('#k-ck input').forEach(c=>c.onchange=()=>{t.checks[+c.dataset.i].d=c.checked;drawCk()});sh.querySelectorAll('#k-ck [data-rm]').forEach(b=>b.onclick=()=>{t.checks.splice(+b.dataset.rm,1);drawCk()})};drawCk();
   const addCk=()=>{const i=sh.querySelector('#k-cki');const v=i.value.trim();if(!v)return;t.checks.push({t:v,d:false});i.value='';drawCk();i.focus()};
   sh.querySelector('#k-cka').onclick=addCk;sh.querySelector('#k-cki').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addCk()}};
   if(isNew)setTimeout(()=>sh.querySelector('#k-t').focus(),60);
   sh.querySelector('#tkf').onsubmit=e=>{e.preventDefault();const title=sh.querySelector('#k-t').value.trim();if(!title)return;
     const o=ex||{id:uid(),created:Date.now()};const wasDone=o.status==='done';Object.assign(o,{title,desc:sh.querySelector('#k-desc').value.trim(),status:t.status,pri:t.pri,due:sh.querySelector('#k-d').value||'',list:sh.querySelector('#k-l').value,checks:t.checks});
     if(o.status==='done'&&!wasDone)o.doneAt=Date.now();if(isNew)S.tasks.items.push(o);closeSheet();save('tasks');toast(isNew?'Task added':'Saved')};
   const del=sh.querySelector('#k-del');if(del)del.onclick=()=>confirmIn(sh,'Delete this task?','Delete',()=>{S.tasks.items=S.tasks.items.filter(x=>x.id!==id);closeSheet();save('tasks');toast('Task deleted')})})}
function listForm(id){const l=S.tasks.lists.find(x=>x.id===id);const isNew=!l;let col=l?l.color:COLORS[(S.tasks.lists.length+2)%COLORS.length];
  openSheet(`<h3>${isNew?'New list':'Edit list'}</h3><form class="form" id="lf"><label class="field"><span>Name</span><input class="inp" id="l-n" required maxlength="30" value="${esc(l?.name||'')}" placeholder="e.g. Exam prep, Home, Shopping"></label>
   <div class="field"><span>Colour</span><div class="swatches" id="l-col">${COLORS.map(x=>`<button type="button" class="sw ${x===col?'on':''}" data-v="${x}" style="background:${x}" aria-label="Colour"></button>`).join('')}</div></div>
   <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">Save</button></div>
   ${isNew?'':`<button type="button" class="link" id="l-del" style="color:var(--bad)">Delete list</button>`}<div class="confirm"></div></form>`,sh=>{
   sh.querySelectorAll('#l-col button').forEach(b=>b.onclick=()=>{col=b.dataset.v;sh.querySelectorAll('#l-col button').forEach(x=>x.classList.toggle('on',x===b))});
   sh.querySelector('#lf').onsubmit=e=>{e.preventDefault();const n=sh.querySelector('#l-n').value.trim();if(!n)return;const o=l||{id:uid()};o.name=n;o.color=col;if(isNew){S.tasks.lists.push(o);UI.tlist=o.id}closeSheet();save('tasks')};
   const del=sh.querySelector('#l-del');if(del)del.onclick=()=>{const n=S.tasks.items.filter(t=>t.list===l.id).length;confirmIn(sh,n?`Delete “${esc(l.name)}” and its ${n} task${n>1?'s':''}?`:`Delete “${esc(l.name)}”?`,'Delete',()=>{S.tasks.lists=S.tasks.lists.filter(x=>x.id!==l.id);S.tasks.items=S.tasks.items.filter(t=>t.list!==l.id);UI.tlist='all';closeSheet();save('tasks')})}})}
function sampleTasks(){const d=n=>dkey(addDays(today(),n));const L=S.tasks.lists;const li=i=>(L[i]||L[0]).id;
  [['Revise concrete mix design notes',li(1),'high','doing',0,[['Water-cement ratio',true],['Slump test',false],['Admixtures',false]]],['Solve 20 MCQs on soil mechanics',li(1),'normal','todo',1,[]],['Pay electricity bill',li(0),'urgent','todo',-1,[]],['Buy groceries for the week',li(0),'normal','todo',2,[['Atta',false],['Daal',false],['Vegetables',false]]],['Send weekly report',li(2),'high','todo',3,[]],['Call the bank about the card',li(0),'low','todo',null,[]],['Past paper 2024',li(1),'normal','done',-2,[]]]
   .forEach(([title,list,pri,status,dn,ck],i)=>S.tasks.items.push({id:uid(),title,list,pri,status,due:dn==null?'':d(dn),desc:'',checks:ck.map(([t,dd])=>({t,d:dd})),created:Date.now()+i,doneAt:status==='done'?Date.now():undefined,sample:true}));
  save('tasks');toast('Sample tasks loaded')}

/* ---------- updates: check GitHub for a newer version and install it ---------- */
const PP_REPO='muhammadusamaamini-ux/Purse-and-Pulse';
function appVer(){try{return window.Android&&Android.appVersionName?{name:Android.appVersionName(),code:Android.appVersionCode()}:null}catch(e){return null}}
function updBanner(){const u=UI.update;return u?`<div class="card row" style="background:var(--accent-soft);border-color:transparent"><span class="grow small" style="min-width:0"><b>Version ${esc(u.name)} is ready.</b> Your data stays as it is.</span><button class="btn sm" data-act="doUpdate">Update</button></div>`:''}
async function checkUpdate(manual){const v=appVer();if(!v)return;
  const st=()=>document.getElementById('upd-status');if(manual&&st())st().textContent='Checking…';
  try{const r=await fetch('https://api.github.com/repos/'+PP_REPO+'/releases/latest',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();const n=parseInt(String(d.tag_name||'').split('.').pop(),10);const a=(d.assets||[]).find(x=>/\.apk$/i.test(x.name));
    UI.update=(n>v.code&&a)?{code:n,name:String(d.tag_name).replace(/^v/,''),url:a.browser_download_url,file:a.name}:null;
    try{localStorage.setItem('pp-upd-checked',String(Date.now()));localStorage.setItem('pp-upd',JSON.stringify(UI.update))}catch(e){}
    if(manual){if(st())st().textContent=UI.update?'Version '+UI.update.name+' is available.':'You have the latest version.';toast(UI.update?'Version '+UI.update.name+' is available':'You have the latest version');if(UI.update&&document.querySelector('.sheet [data-act=checkUpd]')&&!document.querySelector('.sheet [data-act=doUpdate]'))document.querySelector('.sheet [data-act=checkUpd]').insertAdjacentHTML('afterend','<button class="btn" data-act="doUpdate">Update now</button>')}
    if(!document.querySelector('.sheet'))render()}
  catch(e){if(manual){if(st())st().textContent='';toast('Could not check. Connect to the internet and try again.')}}}
function startUpdate(){const u=UI.update;if(!u)return;try{Android.downloadUpdate(u.url,u.file);toast('Downloading version '+u.name+'…')}catch(e){try{Android.openUrl(u.url)}catch(_){toast('Could not start the download.')}}}
window.ppUpdateReady=()=>toast('Download finished. Tap Install, then Open.');
window.ppUpdateFailed=()=>{toast('Download did not finish. Opening it in your browser instead.');try{Android.openUrl(UI.update.url)}catch(_){}};
(()=>{const v=appVer();if(!v)return;try{const u=JSON.parse(localStorage.getItem('pp-upd')||'null');if(u&&u.code>v.code)UI.update=u}catch(e){}
  let last=0;try{last=+localStorage.getItem('pp-upd-checked')||0}catch(e){}
  if(Date.now()-last>6*3600e3)setTimeout(()=>checkUpdate(false),2500)})();

/* ---------- sheets ---------- */
function openSheet(html,onMount){$('#sheetRoot').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;const sh=$('.sheet');onMount&&onMount(sh);
  /* put Cancel and Add/Save at the top, where the keyboard never covers them */
  const a=[...sh.querySelectorAll('form .acts')].find(x=>x.querySelector(':scope > [type=submit]'));if(a){a.closest('form').prepend(a);a.classList.add('top');const er=sh.querySelector('form p.exp[id$="-err"]');if(er)a.after(er)}}
/* ---------- back button: every view and open screen is a step in history ---------- */
const Nav={stack:[]};
const TABS=['habits','insights','money','macc','loans','reports','tlist','tboard','tcal'];
const hashFor=d=>UI.tab+(d?'-s'+d:'');
function parseHash(){const m=location.hash.slice(1).match(/^([a-z]+)(?:-s(\d+))?$/);return m&&TABS.includes(m[1])?{tab:m[1],d:+(m[2]||0)}:null}
function sheetWrap(fn){return function(...a){Nav.stack.push(()=>fn(...a));location.hash=hashFor(Nav.stack.length);return fn(...a)}}
function navBack(){history.back()}
function goTab(tab){if(tab===UI.tab)return;UI.tab=tab;try{sessionStorage.setItem('ah-tab',tab)}catch(e){}render();window.scrollTo(0,0);location.hash=tab}
window.addEventListener('hashchange',()=>{const h=parseHash();if(!h)return;
  if(h.tab!==UI.tab){Nav.stack=[];$('#sheetRoot').innerHTML='';UI.tab=h.tab;try{sessionStorage.setItem('ah-tab',h.tab)}catch(e){}render();window.scrollTo(0,0);if(h.d)location.replace('#'+h.tab);return}
  if(h.d>Nav.stack.length){location.replace('#'+hashFor(Nav.stack.length));return}
  if(h.d<Nav.stack.length){Nav.stack.length=h.d;if(!h.d){$('#sheetRoot').innerHTML='';render()}else Nav.stack[h.d-1]()}});
function closeSheet(){const n=Nav.stack.length;Nav.stack=[];$('#sheetRoot').innerHTML='';render();if(n)history.go(-n)}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function confirmIn(sheet,text,label,fn){const box=sheet.querySelector('.confirm');box.innerHTML=`<div class="card" style="background:var(--bad-soft);border-color:transparent"><p style="margin:0 0 10px">${text}</p><div class="acts"><button class="btn ghost" type="button" data-c="no">Cancel</button><button class="btn danger" type="button" data-c="yes">${label}</button></div></div>`;
  box.querySelector('[data-c=no]').onclick=()=>box.innerHTML='';box.querySelector('[data-c=yes]').onclick=fn}

function habitForm(h){const isNew=!h;h=h||{name:'',color:COLORS[S.habits.list.length%COLORS.length],type:'bool',num:1,den:1,target:1,unit:''};
  const fq=h.type==='num'?'d':h.num===h.den?'d':h.den===7?'w':'n';
  openSheet(`<h3>${isNew?'New habit':'Edit habit'}</h3><form class="form" id="hf">
    <label class="field"><span>Name</span><input class="inp" id="h-name" required maxlength="60" value="${esc(h.name)}" placeholder="e.g. Read 10 pages"></label>
    <div class="field"><span>Type</span><div class="seg" id="h-type"><button type="button" data-v="bool" class="${h.type==='bool'?'on':''}">Yes / No</button><button type="button" data-v="num" class="${h.type==='num'?'on':''}">Measurable</button></div></div>
    <div id="h-bool" ${h.type==='num'?'hidden':''}><div class="field"><span>How often</span><div class="seg" id="h-fq"><button type="button" data-v="d" class="${fq==='d'?'on':''}">Every day</button><button type="button" data-v="w" class="${fq==='w'?'on':''}">Per week</button></div></div>
      <label class="field" id="h-wk" style="margin-top:10px" ${fq==='w'?'':'hidden'}><span>Times per week</span><input class="inp" id="h-num" type="number" min="1" max="6" value="${fq==='w'?h.num:3}"></label></div>
    <div id="h-num-box" class="two" ${h.type==='num'?'':'hidden'}><label class="field"><span>Daily target</span><input class="inp" id="h-target" type="number" min="0.1" step="any" value="${h.target||1}"></label><label class="field"><span>Unit</span><input class="inp" id="h-unit" maxlength="16" value="${esc(h.unit||'')}" placeholder="pages, km, glasses"></label></div>
    <div class="field"><span>Colour</span><div class="swatches" id="h-col">${COLORS.map(c=>`<button type="button" class="sw ${c===h.color?'on':''}" data-v="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div></div>
    <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">${isNew?'Add habit':'Save'}</button></div>
    ${isNew?'':`<div class="field"><span>Position in list</span><div class="acts"><button type="button" class="btn ghost" id="h-up">Move up</button><button type="button" class="btn ghost" id="h-down">Move down</button></div></div>
    <div class="acts"><button type="button" class="btn ghost" id="h-arch">Archive (hide, keep history)</button></div>
    <button type="button" class="link" id="h-del" style="color:var(--bad)">Delete this habit</button>`}<div class="confirm"></div></form>`,sh=>{
    const mv=n=>{const L=S.habits.list,i=L.findIndex(x=>x.id===h.id);let j=i+n;while(j>=0&&j<L.length&&L[j].archived)j+=n;if(j<0||j>=L.length)return toast(n<0?'Already at the top':'Already at the bottom');[L[i],L[j]]=[L[j],L[i]];Store.mark('habits');toast(n<0?'Moved up':'Moved down')};
    if(!isNew){sh.querySelector('#h-up').onclick=()=>mv(-1);sh.querySelector('#h-down').onclick=()=>mv(1);sh.querySelector('#h-arch').onclick=()=>{h.archived=true;closeSheet();save('habits');toast('Habit archived')}}
    let type=h.type,f=fq,col=h.color;
    sh.querySelectorAll('#h-type button').forEach(b=>b.onclick=()=>{type=b.dataset.v;sh.querySelectorAll('#h-type button').forEach(x=>x.classList.toggle('on',x===b));sh.querySelector('#h-bool').hidden=type==='num';sh.querySelector('#h-num-box').hidden=type!=='num'});
    sh.querySelectorAll('#h-fq button').forEach(b=>b.onclick=()=>{f=b.dataset.v;sh.querySelectorAll('#h-fq button').forEach(x=>x.classList.toggle('on',x===b));sh.querySelector('#h-wk').hidden=f!=='w'});
    sh.querySelectorAll('#h-col button').forEach(b=>b.onclick=()=>{col=b.dataset.v;sh.querySelectorAll('#h-col button').forEach(x=>x.classList.toggle('on',x===b))});
    sh.querySelector('#hf').onsubmit=e=>{e.preventDefault();const name=sh.querySelector('#h-name').value.trim();if(!name)return;
      const o=isNew?{id:uid(),created:dkey(today())}:h;o.name=name;o.color=col;o.type=type;
      if(type==='num'){o.num=1;o.den=1;o.target=Math.max(0.1,+sh.querySelector('#h-target').value||1);o.unit=sh.querySelector('#h-unit').value.trim()}
      else if(f==='w'){o.num=Math.min(6,Math.max(1,parseInt(sh.querySelector('#h-num').value)||3));o.den=7}else{o.num=1;o.den=1}
      if(isNew)S.habits.list.push(o);closeSheet();save('habits');toast(isNew?'Habit added':'Saved')};
    const del=sh.querySelector('#h-del');if(del)del.onclick=()=>confirmIn(sh,`Delete “${esc(h.name)}” and all its history? This cannot be undone.`,'Delete',()=>{S.habits.list=S.habits.list.filter(x=>x.id!==h.id);delete S.habits.checks[h.id];closeSheet();save('habits');toast('Habit deleted')});
  })}

function habitDetail(id){const h=S.habits.list.find(x=>x.id===id);if(!h)return;
  const ser=scoreSeries(h,90),s=ser[ser.length-1].s,t=trendOf(h),st=streaks(h);
  const lbls=[[0,''],[30,''],[60,''],[89,'Today']].map(([i,l])=>[i,l||(ser[i].d.getDate()+' '+MON[ser[i].d.getMonth()])]);
  const total=Object.keys(S.habits.checks[h.id]||{}).length;
  // monthly table last 6 months
  const rows=[];for(let i=0;i<6;i++){const ym=shiftYm(dkey(today()).slice(0,7),-i);const[y,m]=ym.split('-').map(Number);const dim=new Date(y,m,0).getDate();let ok=0,n=0,cnt=0;
    for(let d=1;d<=dim;d++){const day=new Date(y,m-1,d);if(day>today()||day<startOf(h))continue;n++;if(satisfied(h,day))ok++;if(doneOn(h,dkey(day)))cnt++}
    if(n)rows.push({ym,ok,n,cnt})}
  // weekly counts last 12 weeks
  const wk=[],wl=[];for(let w=11;w>=0;w--){let c=0;for(let i=0;i<7;i++)if(doneOn(h,dkey(addDays(today(),-(w*7+i)))))c++;wk.push(c);if(w%3===0){const d=addDays(today(),-w*7-6);wl.push([11-w,d.getDate()+' '+MON[d.getMonth()]])}}
  openSheet(`<div class="row" style="margin-bottom:12px"><i class="dot" style="background:${h.color};width:14px;height:14px"></i><h3 class="grow" style="margin:0">${esc(h.name)}</h3><button class="btn sm ghost" data-act="editHabit" data-id="${h.id}">Edit</button></div>
    <div class="small muted" style="margin:-6px 0 12px">${esc(freqText(h))}</div>
    <div class="form">
    <div class="card"><div class="verdict"><div class="grow"><div class="lbl">Habit strength</div><div class="big num" style="color:${h.color}">${pct(s)}</div></div><span class="pill ${t.dir}">${t.dir==='up'?'▲ Improving':t.dir==='down'?'▼ Declining':'■ Steady'} ${Math.abs(Math.round(t.diff*100))} pts</span></div>
      <div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v num">${st.cur}</div><div class="k">Current streak</div></div><div class="kpi"><div class="v num">${st.best}</div><div class="k">Best streak</div></div><div class="kpi"><div class="v num">${total}</div><div class="k">Times done</div></div></div></div>
    <div class="card"><h2>Strength, last 90 days</h2>${lineChart(ser.map(p=>p.s),{color:h.color,labels:lbls})}</div>
    <div class="card"><h2>History</h2>${heatmap(h)}</div>
    <div class="card"><h2>Times per week</h2>${barChart(wk,{colors:wk.map(()=>h.color),yFmt:v=>String(Math.round(v)),max:7,labels:wl})}</div>
    <div class="card"><h2>Month by month</h2><div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Done</th><th>Days</th><th>Success</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${ymLabel(r.ym)}</td><td class="num">${r.cnt}</td><td class="num">${r.n}</td><td class="num">${pct(r.ok/r.n)}</td></tr>`).join('')}</tbody></table></div></div>
    <button class="btn ghost block" data-act="close">Close</button></div>`)}

function numEntry(id,k){const h=S.habits.list.find(x=>x.id===id);const v=(S.habits.checks[id]||{})[k];const d=pkey(k);
  openSheet(`<h3>${esc(h.name)}</h3><form class="form" id="nf"><div class="small muted">${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} · target ${h.target} ${esc(h.unit||'')}</div>
   <label class="field"><span>Amount${h.unit?' ('+esc(h.unit)+')':''}</span><input class="inp amount num" id="n-v" type="number" step="any" min="0" inputmode="decimal" value="${v??''}" placeholder="0"></label>
   <div class="acts"><button type="button" class="btn ghost" id="n-clear">Clear</button><button class="btn" type="submit">Save</button></div></form>`,sh=>{
   const inp=sh.querySelector('#n-v');setTimeout(()=>inp.focus(),50);
   sh.querySelector('#nf').onsubmit=e=>{e.preventDefault();const n=parseFloat(inp.value);const c=S.habits.checks[id]=S.habits.checks[id]||{};if(isNaN(n)||n<=0)delete c[k];else c[k]=n;closeSheet();save('habits')};
   sh.querySelector('#n-clear').onclick=()=>{const c=S.habits.checks[id]||{};delete c[k];closeSheet();save('habits')}})}

function txForm(t,ym){const isNew=!t;t=t?{...t}:{type:'exp',amt:'',cat:null,acc:S.money.accounts[0]?.id,to:S.money.accounts[1]?.id,date:dkey(today()),note:''};
  const draw=sh=>{const type=t.type;const cats=S.money.cats.filter(c=>c.type===type);if(type!=='tr'&&!cats.some(c=>c.id===t.cat))t.cat=null;
    sh.querySelector('#t-cats').innerHTML=type==='tr'?'':`<div class="field"><span>Category</span><div class="chips">${cats.map(c=>`<button type="button" class="chip ${c.id===t.cat?'on':''}" data-v="${c.id}" style="${c.id===t.cat?`background:${c.color};border-color:${c.color};color:#fff`:''}">${esc(c.name)}</button>`).join('')}<button type="button" class="chip" data-new="1">+ New</button></div></div>`;
    sh.querySelector('#t-to').hidden=type!=='tr';sh.querySelector('#t-save').hidden=!(isNew&&type==='inc');sh.querySelector('#t-acc-l').textContent=type==='tr'?'From account':type==='inc'?'Into account':'Paid from';
    sh.querySelectorAll('#t-type button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));
    sh.querySelectorAll('#t-cats .chip').forEach(b=>b.onclick=()=>{if(b.dataset.new){const n=(sh.querySelector('#t-newcat').hidden=false,sh.querySelector('#t-newcat input'));n.focus();return}t.cat=b.dataset.v;draw(sh)})};
  const accOpts=sel=>S.money.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
  openSheet(`<h3>${isNew?'Add record':'Edit record'}</h3><form class="form" id="tf">
    <div class="seg" id="t-type"><button type="button" data-v="exp">Expense</button><button type="button" data-v="inc">Income</button><button type="button" data-v="tr">Transfer</button></div>
    <label class="field"><span>Amount (Rs)</span><input class="inp amount num" id="t-amt" type="number" min="0" step="any" inputmode="decimal" required value="${t.amt}" placeholder="0"></label>
    <div id="t-cats"></div>
    <div class="row" id="t-newcat" hidden><input class="inp" maxlength="30" placeholder="New category name"><button type="button" class="btn sm" id="t-addcat">Add</button></div>
    <div class="two"><label class="field"><span id="t-acc-l">Paid from</span><select class="inp" id="t-acc">${accOpts(t.acc)}</select></label><label class="field"><span>Date</span><input class="inp" type="date" id="t-date" value="${t.date}" required></label></div>
    <div id="t-save" class="card" style="background:var(--accent-soft);border-color:transparent" hidden><div class="small" style="font-weight:600;margin-bottom:8px">Put part of this income into savings</div><div class="two"><label class="field"><span>Amount (optional)</span><input class="inp num" id="t-sv" type="number" min="0" step="any" inputmode="decimal" placeholder="Rs 0"></label><label class="field" ${(S.money.pots||[]).length>1?'':'hidden'}><span>Savings goal</span><select class="inp" id="t-pot">${(S.money.pots||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label></div></div>
    <label class="field" id="t-to"><span>To account</span><select class="inp" id="t-toacc">${accOpts(t.to)}</select></label>
    <label class="field"><span>Note</span><input class="inp" id="t-note" maxlength="80" value="${esc(t.note||'')}" placeholder="Optional"></label>
    <p class="small exp" id="t-err" hidden></p>
    <div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">${isNew?'Add':'Save'}</button></div>
    ${isNew?'':`<button type="button" class="link" id="t-del" style="color:var(--bad)">Delete this record</button>`}<div class="confirm"></div></form>`,sh=>{
    draw(sh);if(isNew)setTimeout(()=>sh.querySelector('#t-amt').focus(),60);
    sh.querySelectorAll('#t-type button').forEach(b=>b.onclick=()=>{t.type=b.dataset.v;draw(sh)});
    sh.querySelector('#t-addcat').onclick=()=>{const inp=sh.querySelector('#t-newcat input');const n=inp.value.trim();if(!n)return;
      const c={id:uid(),name:n,type:t.type==='inc'?'inc':'exp',color:COLORS[S.money.cats.length%COLORS.length]};S.money.cats.push(c);t.cat=c.id;inp.value='';sh.querySelector('#t-newcat').hidden=true;Store.mark('money');draw(sh)};
    sh.querySelector('#tf').onsubmit=e=>{e.preventDefault();const err=sh.querySelector('#t-err');
      const amt=parseFloat(sh.querySelector('#t-amt').value);if(!(amt>0)){err.hidden=false;err.textContent='Enter an amount greater than zero.';return}
      if(t.type!=='tr'&&!t.cat){err.hidden=false;err.textContent='Pick a category.';return}
      const a=sh.querySelector('#t-acc').value,to=sh.querySelector('#t-toacc').value;if(t.type==='tr'&&a===to){err.hidden=false;err.textContent='Choose two different accounts for a transfer.';return}
      const svAmt=isNew&&t.type==='inc'?parseFloat(sh.querySelector('#t-sv').value)||0:0;if(svAmt>amt){err.hidden=false;err.textContent='The savings part cannot be more than the income.';return}
      const o={id:t.id||uid(),type:t.type,amt:Math.round(amt*100)/100,acc:a,date:sh.querySelector('#t-date').value||dkey(today()),note:sh.querySelector('#t-note').value.trim(),t:t.t||Date.now()};
      if(t.type==='tr')o.to=to;else o.cat=t.cat;if(t.sample)o.sample=true;
      const ids=[];if(!isNew){S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);ids.push('tx-'+ym)}
      const nym=ymOf(o.date);(S.tx[nym]=S.tx[nym]||[]).push(o);ids.push('tx-'+nym);UI.ym=nym;
      if(svAmt>0){ensureSav();const pp=sh.querySelector('#t-pot').value;const so={id:uid(),type:'tr',amt:Math.round(svAmt*100)/100,acc:a===savId()?(S.money.accounts.find(x=>x.id!==savId())||{}).id:a,to:savId(),date:o.date,note:'From '+cat(o.cat).name.toLowerCase(),t:Date.now()+1};if(pp&&pp!==genPot().id)so.pot=pp;S.tx[nym].push(so);Store.mark('money')}
      closeSheet();save(...new Set(ids));toast(svAmt>0?'Income added and '+fmt(svAmt)+' saved':isNew?'Record added':'Saved')};
    const del=sh.querySelector('#t-del');if(del)del.onclick=()=>confirmIn(sh,'Delete this record?','Delete',()=>{S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);closeSheet();save('tx-'+ym);toast('Record deleted')});
  })}

/* ---------- loans: money you lent (to get back) and money you borrowed (to pay back) ---------- */
const LOANC={lent:'#C98A12',borrowed:'#8A4FBF'};
function loans(){return S.money.loans||(S.money.loans=[])}
function loanById(id){return loans().find(l=>l.id===id)}
function loanTx(id){return allTx().filter(t=>t.type==='ln'&&t.loan===id).sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0))}
function isPrincipal(t,l){return (l.dir==='lent')===(t.mv==='out')}
function loanStat(l){let given=0,back=0;loanTx(l.id).forEach(t=>{if(isPrincipal(t,l))given+=t.amt;else back+=t.amt});return{given,back,left:Math.round((given-back)*100)/100}}
function lnLabel(t,l){const n=l.name;return l.dir==='lent'?(t.mv==='out'?'Lent to '+n:'Received from '+n):(t.mv==='in'?'Borrowed from '+n:'Paid back to '+n)}
function loanAccs(l){return [...new Set(loanTx(l.id).filter(t=>isPrincipal(t,l)).map(t=>acc(t.acc).name))].join(', ')}
function loanHome(l){return (loanTx(l.id).find(t=>isPrincipal(t,l))||{}).acc}
function accPick(id,sel,label){const bal=balances();return `<div class="field"><span>${label}</span><div class="chips" id="${id}-g">${S.money.accounts.map(a=>`<button type="button" class="chip ${a.id===sel?'on':''}" data-v="${a.id}">${esc(a.name)} <span class="num" style="opacity:.7;font-weight:500">${fmt(bal[a.id]||0)}</span></button>`).join('')}</div><input type="hidden" id="${id}" value="${sel||''}"></div>`}
function bindPick(sh,id,onChange){sh.querySelectorAll('#'+id+'-g .chip').forEach(b=>b.onclick=()=>{sh.querySelector('#'+id).value=b.dataset.v;sh.querySelectorAll('#'+id+'-g .chip').forEach(x=>x.classList.toggle('on',x===b));onChange&&onChange(b.dataset.v)})}
function fmtDate(k){const d=pkey(k);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function vLoans(){const L=loans();const st=L.map(l=>({l,...loanStat(l)}));
  const get=st.filter(x=>x.l.dir==='lent').reduce((a,x)=>a+Math.max(0,x.left),0),owe=st.filter(x=>x.l.dir==='borrowed').reduce((a,x)=>a+Math.max(0,x.left),0);
  const f=UI.lf||'all',k=dkey(today());
  const shown=st.filter(x=>f==='all'||x.l.dir===f);
  const open=shown.filter(x=>x.left>0).sort((a,b)=>(a.l.due||'9999').localeCompare(b.l.due||'9999')),done=shown.filter(x=>x.left<=0);
  const card=x=>{const l=x.l,r=x.given?Math.min(1,x.back/x.given):0,late=x.left>0&&l.due&&l.due<k;
    return `<button class="card" data-act="loanDetail" data-id="${l.id}" style="text-align:left;width:100%;display:flex;flex-direction:column;gap:8px">
     <div class="row"><span class="badge" style="background:${LOANC[l.dir]}">${esc((l.name||'?')[0].toUpperCase())}</span><span class="grow" style="min-width:0"><b style="overflow-wrap:anywhere">${esc(l.name)}</b><div class="small muted">${l.dir==='lent'?'You lent':'You borrowed'} ${fmt(x.given)}${loanAccs(l)?` · ${l.dir==='lent'?'from':'into'} ${esc(loanAccs(l))}`:''}</div></span>
      <span style="text-align:right">${x.left>0?`<div class="num ${l.dir==='lent'?'inc':'exp'}" style="font-weight:700">${fmt(x.left)}</div><div class="small muted">${l.dir==='lent'?'to get back':'to pay back'}</div>`:'<span class="pill up">Settled</span>'}</span></div>
     ${x.given?`<div class="bar"><i style="width:${r*100}%;background:${LOANC[l.dir]}"></i></div>`:''}
     <div class="small ${late?'exp':'muted'}">${x.back?`${fmt(x.back)} ${l.dir==='lent'?'received back':'paid back'}`:'Nothing repaid yet'}${l.due&&x.left>0?` · ${late?'was due':'due'} ${fmtDate(l.due)}`:''}</div></button>`};
  return `<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="v num inc" style="font-size:19px">${fmt(get)}</div><div class="k">You will get back</div></div><div class="kpi"><div class="v num exp" style="font-size:19px">${fmt(owe)}</div><div class="k">You owe</div></div></div>
   <div class="chips">${[['all','All'],['lent','I lent'],['borrowed','I borrowed']].map(([v,t])=>`<button class="chip ${f===v?'on':''}" data-act="lf" data-v="${v}">${t}</button>`).join('')}</div>
   ${!L.length?`<div class="card empty"><div class="lbl">Loans</div><h3>Keep track of loans</h3><p class="small muted" style="margin:0 auto 14px;max-width:34ch">Record money you gave to someone or took from someone, with their name and dates. Add each repayment and see how much is left.</p><div class="acts"><button class="btn" data-act="loanNew" data-dir="lent">I lent money</button><button class="btn ghost" data-act="loanNew" data-dir="borrowed">I borrowed money</button></div></div>`
    :`${open.length?`<div class="gh"><span>Open</span><span class="num">${open.length}</span></div>${open.map(card).join('')}`:`<div class="card empty"><h3>Nothing open</h3><p class="small muted">All ${f==='all'?'':f==='lent'?'money you lent ':'money you borrowed '}is settled.</p></div>`}
      ${done.length?`<details><summary class="gh" style="cursor:pointer;list-style:none"><span>Settled (${done.length})</span><span>Show</span></summary><div style="display:flex;flex-direction:column;gap:10px">${done.map(card).join('')}</div></details>`:''}`}
   <p class="note">Loans move money in and out of your accounts but are not counted as income or expense.</p>`}
function loanDetail(id){const l=loanById(id);if(!l)return;const x=loanStat(l),k=dkey(today()),late=x.left>0&&l.due&&l.due<k;
  const items=loanTx(l.id);let run=0;const after={};items.forEach(t=>{run+=isPrincipal(t,l)?t.amt:-t.amt;after[t.id]=run});
  openSheet(`<div class="row" style="margin-bottom:10px"><span class="badge" style="background:${LOANC[l.dir]}">${esc((l.name||'?')[0].toUpperCase())}</span><h3 class="grow" style="margin:0;overflow-wrap:anywhere">${esc(l.name)}</h3><button class="btn sm ghost" data-act="loanEdit" data-id="${l.id}">Edit</button></div>
   <div class="card" style="margin-bottom:12px"><div class="lbl">${x.left>0?(l.dir==='lent'?'Left to get back':'Left to pay back'):'Settled'}</div>
    <div class="num ${x.left>0?(l.dir==='lent'?'inc':'exp'):''}" style="font-family:var(--f-display);font-size:30px;font-weight:700">${fmt(Math.max(0,x.left))}</div>
    ${x.given?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(1,x.back/x.given)*100}%;background:${LOANC[l.dir]}"></i></div>`:''}
    <div class="small muted" style="margin-top:6px">${l.dir==='lent'?'You lent':'You borrowed'} ${fmt(x.given)}${loanAccs(l)?` ${l.dir==='lent'?'from':'into'} <b style="color:var(--fg)">${esc(loanAccs(l))}</b>`:''} · ${fmt(x.back)} ${l.dir==='lent'?'received back':'paid back'}</div>
    ${l.due?`<div class="small ${late?'exp':'muted'}">${late?'Was due':'Due'} ${fmtDate(l.due)}</div>`:''}
    ${l.phone?`<div class="small muted" style="user-select:all">Phone: ${esc(l.phone)}</div>`:''}
    ${l.note?`<div class="small muted" style="overflow-wrap:anywhere">${esc(l.note)}</div>`:''}

   sh.querySelector('#lnf').onsubmit=e=>{e.preventDefault();const err=sh.querySelector('#ln-err');const name=sh.querySelector('#ln-n').value.trim();if(!name){err.hidden=false;err.textContent='Enter the person\'s name.';return}
     const o=l||{id:uid(),dir:d,created:Date.now()};o.name=name;o.due=sh.querySelector('#ln-due').value||'';o.phone=sh.querySelector('#ln-ph').value.trim();o.note=sh.querySelector('#ln-note').value.trim();

       loans().push(o);(S.tx[ymOf(date)]=S.tx[ymOf(date)]||[]).push(r);ids.push('tx-'+ymOf(date))}

function loanPay(id,kind,t,ym){const l=loanById(id);if(!l)return;const isNew=!t;
  if(t)kind=isPrincipal(t,l)?'more':'repay';

  const title={lent:{repay:'Received from '+l.name,more:'Lend more to '+l.name},borrowed:{repay:'Pay back '+l.name,more:'Borrow more from '+l.name}}[l.dir][kind];
  const inAcc=(l.dir==='lent')===(kind==='repay');const home=loanHome(l);
  openSheet(`<h3 style="overflow-wrap:anywhere">${esc(title)}</h3><form class="form" id="lpf">
   <label class="field"><span>Amount (Rs)</span><input class="inp amount num" id="lp-a" type="number" min="0" step="any" inputmode="decimal" required value="${t?t.amt:''}" placeholder="0"></label>
   ${kind==='repay'&&left>0?`<div class="chips" style="margin-top:-6px"><button type="button" class="chip" id="lp-full">Full amount left · ${fmt(left)}</button></div>`:''}

   ${home&&kind==='repay'?`<p class="small muted" style="margin:-6px 0 0">This loan ${l.dir==='lent'?'came from':'went into'} <b>${esc(acc(home).name)}</b>, so the repayment goes ${l.dir==='lent'?'back to':'out of'} it unless you pick another account.</p>`:''}
   <label class="field"><span>Date</span><input class="inp" type="date" id="lp-d" value="${t?t.date:dkey(today())}" required></label>
   <label class="field"><span>Note</span><input class="inp" id="lp-note" maxlength="80" value="${esc(t?.note||'')}" placeholder="Optional"></label>

     const o={id:t?.id||uid(),type:'ln',loan:l.id,mv:inAcc?'in':'out',amt:Math.round(amt*100)/100,acc:sh.querySelector('#lp-acc').value,date:sh.querySelector('#lp-d').value||dkey(today()),note:sh.querySelector('#lp-note').value.trim(),t:t?.t||Date.now()};
     const ids=[];if(!isNew){S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);ids.push('tx-'+ym)}
     const nym=ymOf(o.date);(S.tx[nym]=S.tx[nym]||[]).push(o);ids.push('tx-'+nym);closeSheet();save(...new Set(ids));
     const nl=loanStat(l).left;toast(nl<=0&&kind==='repay'?'Loan settled':'Saved')};
   const del=sh.querySelector('#lp-del');if(del)del.onclick=()=>confirmIn(sh,'Delete this record?','Delete',()=>{S.tx[ym]=(S.tx[ym]||[]).filter(x=>x.id!==t.id);closeSheet();save('tx-'+ym);toast('Record deleted')})})}

/* ---------- history: every record for a savings goal or an account, with running balance ---------- */
function histHtml(items,delta,{empty='No records yet.',start=0}={}){
  const asc=items.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0));let run=start;const bal={};asc.forEach(t=>{run+=delta(t);bal[t.id]=run});
  const desc=asc.reverse();if(!desc.length)return `<p class="small muted" style="margin:6px 2px">${empty}</p>`;
  let inn=0,out=0;desc.forEach(t=>{const d=delta(t);if(d>0)inn+=d;else out-=d});
  const groups={};desc.forEach(t=>{const k=ymOf(t.date);(groups[k]=groups[k]||[]).push(t)});
  return `<div class="kpis" style="margin-bottom:6px"><div class="kpi"><div class="v num inc" style="font-size:17px">${fmtK(inn)}</div><div class="k">Total in</div></div><div class="kpi"><div class="v num exp" style="font-size:17px">${fmtK(out)}</div><div class="k">Total out</div></div><div class="kpi"><div class="v num" style="font-size:17px">${desc.length}</div><div class="k">Records</div></div></div>`+
   Object.entries(groups).map(([ym,L])=>`<div class="day-h"><span>${ymLabel(ym)}</span><span class="num">${(()=>{const n=L.reduce((a,t)=>a+delta(t),0);return (n>0?'+':'')+fmt(n)})()}</span></div><div class="txlist">${L.map(t=>{const d=delta(t),dt=pkey(t.date);
     const c=t.type==='ln'?{name:txName(t),color:LOANC[(loanById(t.loan)||{}).dir]||'#6B5B4B'}:t.type==='tr'?{name:'Transfer',color:'#5B6964'}:(t.type==='sv'||t.type==='sw')?{name:txName(t),color:pot(t.pot).color}:cat(t.cat);
     const via=t.type==='tr'?(d>0?'From '+acc(t.acc).name:'To '+acc(t.to).name):t.type==='sv'?'From '+acc(t.acc).name:t.type==='sw'?'Into '+acc(t.acc).name:'';
     return `<button class="tx" data-act="editTx" data-id="${t.id}" data-ym="${ymOf(t.date)}"><span class="badge" style="background:${c.color}">${t.type==='tr'?'⇄':(t.type==='sv'||t.type==='sw')?'S':esc(c.name[0])}</span><span class="grow" style="min-width:0"><div class="t">${dt.getDate()} ${MON[dt.getMonth()]} ${dt.getFullYear()}</div><div class="s">${esc(t.type==='tr'||t.type==='sv'||t.type==='sw'?via:c.name)}${t.note?' · '+esc(t.note):''}</div></span><span style="text-align:right"><div class="a num ${d>0?'inc':'exp'}">${d>0?'+':'−'}${fmt(Math.abs(d)).replace('−','')}</div><div class="s num" style="font-size:11.5px;color:var(--muted)">Bal ${fmt(bal[t.id])}</div></span></button>`}).join('')}</div>`).join('')}
function potDetail(id){const p=(S.money.pots||[]).find(x=>x.id===id);if(!p)return;const b=potBal(p.id),r=p.target?b/p.target:0;const gen=p.id===genPot().id;

    ${p.target?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(Math.max(r,0),1)*100}%;background:${r>=1?'var(--good)':p.color}"></i></div><div class="small muted" style="margin-top:4px">${pct(Math.max(r,0))} of ${fmt(p.target)}${p.date?' · by '+(d=>d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear())(pkey(p.date)):''}</div>`:''}

   ${isNew?'':`<button type="button" class="link" id="s-del" style="color:var(--bad)">Delete this record</button>`}<div class="confirm"></div></form>`,sh=>{

function reorderCats(){
  const row=(c,i,L)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><i class="dot" style="background:${c.color}"></i><span class="grow">${esc(c.name)}</span>
    <button type="button" class="mini" data-mv="${c.id}" data-n="top" aria-label="Move ${esc(c.name)} to top" ${i===0?'disabled style="opacity:.3"':''}>⤒</button>
    <button type="button" class="mini" data-mv="${c.id}" data-n="-1" aria-label="Move ${esc(c.name)} up" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
    <button type="button" class="mini" data-mv="${c.id}" data-n="1" aria-label="Move ${esc(c.name)} down" ${i===L-1?'disabled style="opacity:.3"':''}>↓</button></div>`;
  const draw=sh=>{const ex=S.money.cats.filter(c=>c.type==='exp'),inc=S.money.cats.filter(c=>c.type==='inc');
    sh.querySelector('#ro').innerHTML=`<div class="lbl">Expense</div><div>${ex.map((c,i)=>row(c,i,ex.length)).join('')}</div><div class="lbl" style="margin-top:14px">Income</div><div>${inc.map((c,i)=>row(c,i,inc.length)).join('')}</div>`;
    sh.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const c=S.money.cats.find(x=>x.id===b.dataset.mv);const same=S.money.cats.filter(x=>x.type===c.type);let k=same.indexOf(c);
      const others=S.money.cats.filter(x=>x.type!==c.type);same.splice(k,1);
      if(b.dataset.n==='top')k=0;else k=Math.max(0,Math.min(same.length,k+(+b.dataset.n)));same.splice(k,0,c);
      S.money.cats=c.type==='exp'?[...same,...others]:[...others,...same];Store.mark('money');draw(sh)})};
  openSheet(`<h3>Reorder categories</h3><p class="small muted" style="margin:-8px 0 12px">⤒ moves a category to the top. The order here is the order you see when adding a record.</p><div id="ro"></div><button class="btn block" style="margin-top:16px" id="ro-done">Done</button>`,sh=>{draw(sh);sh.querySelector('#ro-done').onclick=navBack})}
function catForm(id,type){const c=S.money.cats.find(x=>x.id===id);const isNew=!c;const used=c&&allTx().some(t=>t.cat===c.id);let col=c?c.color:COLORS[S.money.cats.length%COLORS.length];
  openSheet(`<h3>${isNew?'New category':'Edit category'}</h3><form class="form" id="cf"><label class="field"><span>Name</span><input class="inp" id="c-n" required maxlength="30" value="${esc(c?.name||'')}"></label>
   <div class="field"><span>Colour</span><div class="swatches" id="c-col">${COLORS.map(x=>`<button type="button" class="sw ${x===col?'on':''}" data-v="${x}" style="background:${x}" aria-label="Colour"></button>`).join('')}</div></div>
   <div class="acts"><button type="button" class="btn ghost" id="c-back">Back</button><button class="btn" type="submit">Save</button></div>
   ${isNew?'':`<button type="button" class="link" id="c-del" style="color:var(--bad)">Delete category</button>`}<div class="confirm"></div></form>`,sh=>{

function loadSample(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const T=today();
  const hs=[{name:'Pray Fajr on time',color:COLORS[0],p0:.55,p1:.9},{name:'Read Quran',color:COLORS[1],p0:.4,p1:.75},{name:'Exercise',color:COLORS[2],p0:.6,p1:.35,den:7,num:4},{name:'Study',color:COLORS[4],type:'num',target:2,unit:'hours',p0:.5,p1:.8}];
  hs.forEach(o=>{const h={id:uid(),name:o.name,color:o.color,type:o.type||'bool',num:o.num||1,den:o.den||1,target:o.target||1,unit:o.unit||'',created:dkey(addDays(T,-80)),sample:true};
    const c={};for(let i=80;i>=1;i--){const p=o.p0+(o.p1-o.p0)*(1-i/80);if(rnd()<p)c[dkey(addDays(T,-i))]=h.type==='num'?Math.round((1+rnd()*2)*2)/2:1}
    S.habits.list.push(h);S.habits.checks[h.id]=c});
  const ex=[['e0',[250,900]],['e1',[1500,4500]],['e2',[150,600]],['e3',[3000,9000]],['e4',[500,1500]],['e6',[1000,6000]],['e7',[500,3000]],['e10',[200,1000]]];
  for(let mo=2;mo>=0;mo--){const base=new Date(T.getFullYear(),T.getMonth()-mo,1);const dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();const lastDay=mo===0?T.getDate():dim;
    const add=(day,o)=>{const d=new Date(base.getFullYear(),base.getMonth(),day);const k=dkey(d);(S.tx[k.slice(0,7)]=S.tx[k.slice(0,7)]||[]).push({id:uid(),date:k,t:Date.now(),sample:true,...o})};
    add(1,{type:'inc',amt:85000,cat:'i0',acc:'bank',note:'Monthly salary'});add(1,{type:'exp',amt:25000,cat:'e5',acc:'bank',note:'House rent'});
    add(2,{type:'tr',amt:30000,acc:'bank',to:'cash',note:'ATM'});
    for(let d=1;d<=lastDay;d++){const n=rnd()<.35?2:rnd()<.7?1:0;for(let j=0;j<n;j++){const[c,[lo,hi]]=ex[Math.floor(rnd()*ex.length)];add(d,{type:'exp',amt:Math.round((lo+rnd()*(hi-lo))/10)*10,cat:c,acc:rnd()<.65?'cash':'wallet',note:''})}}
    ensureSav();add(1,{type:'tr',amt:10000,acc:'bank',to:'sav',note:'From salary'});
    add(Math.min(3,lastDay),{type:'tr',amt:15000,acc:'bank',to:'wallet',note:'Top up'})}
  if(!Object.keys(S.money.budgets).length)S.money.budgets={e0:12000,e1:15000,e2:6000,e6:8000};
  save('habits','money',...Object.keys(S.tx).map(m=>'tx-'+m));toast('Sample data loaded')}
function clearSample(){const ids=S.habits.list.filter(h=>h.sample).map(h=>h.id);S.habits.list=S.habits.list.filter(h=>!h.sample);ids.forEach(i=>delete S.habits.checks[i]);
  const ms=Object.keys(S.tx);ms.forEach(m=>{S.tx[m]=S.tx[m].filter(t=>!t.sample)});save('habits',...ms.map(m=>'tx-'+m));toast('Sample data removed')}

function onAct(e){const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='close')return closeSheet();
  if(a==='cell'){const c=S.habits.checks[el.dataset.id]=S.habits.checks[el.dataset.id]||{};if(c[el.dataset.k]!=null)delete c[el.dataset.k];else c[el.dataset.k]=1;
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}return save('habits')}
  if(a==='cellNum')return numEntry(el.dataset.id,el.dataset.k);
  if(a==='openHabit')return habitDetail(el.dataset.id);
  if(a==='editHabit')return habitForm(S.habits.list.find(h=>h.id===el.dataset.id));
  if(a==='newHabit')return habitForm();
  if(a==='quickHabit'){S.habits.list.push({id:uid(),name:el.dataset.n,color:COLORS[S.habits.list.length%COLORS.length],type:'bool',num:1,den:1,target:1,unit:'',created:dkey(today())});return save('habits')}
  if(a==='loadSample')return loadSample();
  if(a==='clearSample')return clearSample();
  if(a==='ym'){UI.ym=shiftYm(UI.ym,+el.dataset.n);return render()}
  if(a==='rym'){UI.rym=shiftYm(UI.rym,+el.dataset.n);return render()}
  if(a==='editTx'){const ym=el.dataset.ym;const t=(S.tx[ym]||[]).find(t=>t.id===el.dataset.id);if(t&&t.type==='ln')return loanPay(t.loan,null,t,ym);return t&&(t.type==='sv'||t.type==='sw'||isSavTx(t))?savingsForm(t,ym):txForm(t,ym)}
  if(a==='saveIn')return savingsForm(null,null,'in',el.dataset.pot);
  if(a==='potDetail')return potDetail(el.dataset.id);
  if(a==='checkUpd')return checkUpdate(true);
  if(a==='doUpdate')return startUpdate();
  if(a==='lf'){UI.lf=el.dataset.v;return render()}
  if(a==='loanDetail')return loanDetail(el.dataset.id);
  if(a==='loanNew')return loanForm(null,el.dataset.dir);
  if(a==='loanEdit')return loanForm(el.dataset.id);
  if(a==='loanPay')return loanPay(el.dataset.id,el.dataset.k);
  if(a==='accDetail')return accDetail(el.dataset.id);
  if(a==='savHist')return savHistory();
  if(a==='saveOut')return savingsForm(null,null,'out',el.dataset.pot);
  if(a==='editPot')return potForm(el.dataset.id);
  if(a==='sub')return goTab(el.dataset.v);
  if(a==='tdone'){const t=S.tasks.items.find(x=>x.id===el.dataset.id);if(!t)return;if(t.status==='done'){t.status='todo';delete t.doneAt}else{t.status='done';t.doneAt=Date.now();toast('Done: '+t.title)}if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}return save('tasks')}
  if(a==='topen')return taskForm(el.dataset.id);
  if(a==='tnew')return taskForm(null,{due:el.dataset.due||''});
  if(a==='tmove'){const t=S.tasks.items.find(x=>x.id===el.dataset.id);const i=STATUS.findIndex(s=>s[0]===(t.status||'todo'))+(+el.dataset.n);t.status=STATUS[i][0];if(t.status==='done')t.doneAt=Date.now();else delete t.doneAt;return save('tasks')}
  if(a==='tl'){if(el.dataset.v!=='all'&&UI.tlist===el.dataset.v)return listForm(el.dataset.v);UI.tlist=el.dataset.v;return render()}
  if(a==='listForm')return listForm();
  if(a==='toggleDone'){UI.showDone=!UI.showDone;return render()}
  if(a==='cym'){UI.cym=shiftYm(UI.cym,+el.dataset.n);return render()}
  if(a==='csel'){UI.csel=el.dataset.v;if(ymOf(UI.csel)!==UI.cym)UI.cym=ymOf(UI.csel);return render()}
  if(a==='sampleTasks')return sampleTasks();
  if(a==='clearSampleTasks'){S.tasks.items=S.tasks.items.filter(t=>!t.sample);save('tasks');return toast('Sample tasks removed')}
  if(a==='budgets')return budgetsForm();
  if(a==='editAcc')return accForm(el.dataset.id);
  if(a==='editCat')return catForm(el.dataset.id,el.dataset.t);
  if(a==='reorderCats')return reorderCats();
  if(a==='unarchive'){const h=S.habits.list.find(x=>x.id===el.dataset.id);if(h)h.archived=false;save('habits');return toast('Habit restored')}
}
